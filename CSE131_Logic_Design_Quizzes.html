<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Design Quizzes (CSE131) - EDUGATE</title>
  <meta name="description" content="Interactive quizzes page for Logic Design (CSE131) as part of EDUGATE platform.">

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono, Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX CDN for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg: #030305;
      --surface: #0a0a0f;
      --surface-card: #111118;
      --primary: #6366f1;
      --text: #f1f5f9;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }

    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    [dir="rtl"] {
      font-family: 'Cairo', 'Inter', system-ui, sans-serif;
    }

    [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] h4 {
      font-family: 'Cairo', 'Space Grotesk', system-ui, sans-serif;
    }

    /* Ambient animated gradient mesh background */
    .bg-blobs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(120px);
      opacity: 0.1;
    }
    .blob-1 {
      top: -100px;
      left: -100px;
      width: 450px;
      height: 450px;
      background: #6366f1;
      animation: float1 20s infinite alternate ease-in-out;
    }
    .blob-2 {
      top: 40%;
      right: -100px;
      width: 400px;
      height: 400px;
      background: #06b6d4;
      animation: float2 24s infinite alternate ease-in-out;
    }
    .blob-3 {
      bottom: -100px;
      left: 30%;
      width: 450px;
      height: 450px;
      background: #4f46e5;
      animation: float1 18s infinite alternate-reverse ease-in-out;
    }

    @keyframes float1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, -40px) scale(1.1); }
    }
    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-40px, 30px) scale(0.95); }
    }

    /* Glassmorphic Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(3, 3, 5, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .badge-course {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
    }

    /* Quiz Cards Grid */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s, border-color 0.25s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .quiz-card:hover {
      transform: translateY(-5px);
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.3);
    }

    /* Option Cards */
    .option-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
      text-align: left;
      color: var(--text);
    }
    .option-card:hover {
      border-color: var(--primary);
    }
    .option-card.selected {
      border-color: var(--primary);
      border-left: 3px solid var(--primary);
      background-color: rgba(99, 102, 241, 0.08);
    }
    [dir="rtl"] .option-card.selected {
      border-left: 1px solid var(--primary);
      border-right: 3px solid var(--primary);
      text-align: right;
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
      margin-right: 0.85rem;
    }
    [dir="rtl"] .option-letter {
      margin-right: 0;
      margin-left: 0.85rem;
    }
    .option-card.selected .option-letter {
      background: var(--primary);
      border-color: #818cf8;
      color: #fff;
    }

    /* Explanation Box */
    .explanation-box {
      background: rgba(99, 102, 241, 0.03);
      border-left: 3px solid var(--primary);
      border-radius: 0 12px 12px 0;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    [dir="rtl"] .explanation-box {
      border-left: none;
      border-right: 3px solid var(--primary);
      border-radius: 12px 0 0 12px;
    }

    /* Floating Translate Button */
    .translate-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 50;
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #818cf8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s, border-color 0.2s;
    }
    .translate-btn:hover {
      transform: scale(1.1);
      border-color: rgba(99, 102, 241, 0.6);
      color: #fff;
    }
    .lang-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #4f46e5;
      color: #fff;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 9999px;
      border: 1px solid var(--bg);
    }

    /* Buttons */
    .btn-primary {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 6px 20px -4px rgba(99, 102, 241, 0.4);
    }
    .btn-primary:hover:not(:disabled) {
      background: #4f46e5;
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      background: #1e1e2d;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: var(--surface-card);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .btn-secondary:hover:not(:disabled) {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Question dots */
    .dot-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: #64748b;
      transition: all 0.15s;
    }
    .dot-btn.current {
      background: var(--primary);
      border-color: #818cf8;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
    }
    .dot-btn.answered {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
    }

    /* Score Circle */
    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 9999px;
      border: 4px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 1.5rem auto;
      font-family: 'Space Grotesk', sans-serif;
    }
    .score-green {
      border-color: #10b981;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
    }
    .score-yellow {
      border-color: #f59e0b;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.1);
    }
    .score-red {
      border-color: #ef4444;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .navbar { padding: 0 1rem; }
      .container { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- Background Animated Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <button class="nav-btn" id="btnBackEdugate" onclick="handleBackAction()">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span id="navBackText">← Back to EDUGATE</span>
    </button>
    <div style="font-weight: 700; font-size: 1rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px;">
      <i data-lucide="cpu" style="width: 18px; height: 18px; color: #818cf8;"></i>
      <span id="navTitle">Logic Design Quizzes</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="badge-course">CSE131</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container" id="appMain">
    <!-- Dynamic View Loaded Here -->
  </main>

  <!-- Footer -->
  <footer style="border-top: 1px solid var(--border); padding: 1.5rem; text-align: center; font-size: 0.75rem; color: #64748b; font-family: 'JetBrains Mono', monospace; position: relative; z-index: 10;">
    <span id="footerText">EDUGATE © 2026 · CSE131 Logic Design Quizzes</span>
  </footer>

  <!-- Floating Translate Button -->
  <button class="translate-btn" onclick="toggleLanguage()" title="Toggle English / Arabic" aria-label="Translate">
    <i data-lucide="globe" style="width: 22px; height: 22px;"></i>
    <span class="lang-badge" id="langBadge">EN</span>
  </button>

  <!-- App Logic Script -->
  <script>
    // Import question data from storage or fallback embedded dataset
    let currentLanguage = localStorage.getItem('edugate_quiz_lang') || 'en';
    let currentView = 'list'; // 'list' | 'quiz' | 'results'
    let currentQuizId = 1;
    let currentQuestionIndex = 0;
    let userAnswers = {}; // questionId -> optionId

    function getStoredProgress() {
      try {
        return JSON.parse(localStorage.getItem('edugate_quiz_progress') || '{}');
      } catch {
        return {};
      }
    }

    function saveProgress(quizId, score, total) {
      const p = getStoredProgress();
      const existingBest = p[quizId]?.bestScore || 0;
      p[quizId] = {
        completed: true,
        score: score,
        total: total,
        bestScore: Math.max(existingBest, score),
        percent: Math.round((score / total) * 100),
        date: new Date().toISOString()
      };
      localStorage.setItem('edugate_quiz_progress', JSON.stringify(p));
    }

    // Load Quiz Data from main window or API
    let QUIZZES = [];

    // Initialize after DOM load
    window.addEventListener('DOMContentLoaded', async () => {
      // Check if host app window has quizzes or fetch
      try {
        const res = await fetch('/src/data/quizzes.ts');
        // If not found in plain HTML, we use embedded dataset
      } catch {}

      // Fallback or embedded definitions will be initialized
      initEmbeddedQuizzes();
      updateLanguageUI();
      renderCurrentView();
      lucide.createIcons();
    });

    function toggleLanguage() {
      currentLanguage = currentLanguage === 'en' ? 'ar' : 'en';
      localStorage.setItem('edugate_quiz_lang', currentLanguage);
      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
      updateLanguageUI();
      renderCurrentView();
    }

    function updateLanguageUI() {
      const isAr = currentLanguage === 'ar';
      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.getElementById('langBadge').innerText = isAr ? 'ع' : 'EN';
      
      const backText = document.getElementById('navBackText');
      if (currentView === 'list') {
        backText.innerText = isAr ? '← العودة إلى إديوجيت' : '← Back to EDUGATE';
      } else {
        backText.innerText = isAr ? '← قائمة الاختبارات' : '← Back to Quizzes';
      }

      document.getElementById('navTitle').innerText = isAr ? 'اختبارات التصميم المنطقي' : 'Logic Design Quizzes';
      document.getElementById('footerText').innerText = isAr 
        ? 'EDUGATE © 2026 · منصة اختبارات التصميم المنطقي CSE131'
        : 'EDUGATE © 2026 · CSE131 Logic Design Quizzes';
    }

    function handleBackAction() {
      if (currentView !== 'list') {
        currentView = 'list';
        userAnswers = {};
        updateLanguageUI();
        renderCurrentView();
      } else {
        window.location.href = 'index.html';
      }
    }

    function openQuiz(quizId) {
      currentQuizId = quizId;
      currentQuestionIndex = 0;
      userAnswers = {};
      currentView = 'quiz';
      updateLanguageUI();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentView() {
      const main = document.getElementById('appMain');
      if (currentView === 'list') {
        renderQuizList(main);
      } else if (currentView === 'quiz') {
        renderQuizInterface(main);
      } else if (currentView === 'results') {
        renderQuizResults(main);
      }
      lucide.createIcons();
    }

    /* 1. Quiz List Page */
    function renderQuizList(container) {
      const isAr = currentLanguage === 'ar';
      const progress = getStoredProgress();

      let cardsHtml = '';
      QUIZZES.forEach(q => {
        const p = progress[q.id];
        const isDone = p && p.completed;
        const total = q.questions.length;
        const bestScore = isDone ? p.bestScore : 0;
        const bestPercent = isDone ? Math.round((bestScore / total) * 100) : 0;

        cardsHtml += `
          <div class="quiz-card" onclick="openQuiz(${q.id})">
            <div>
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; color: #818cf8;">
                  ${isAr ? 'اختبار ' + q.id : 'QUIZ 0' + q.id} · <span style="color: #94a3b8; font-weight: normal;">${isAr ? q.difficultyAr : q.difficulty}</span>
                </span>
                ${isDone ? `
                  <span style="color: #34d399; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; display: flex; align-items: center; gap: 4px;">
                    <i data-lucide="check-circle-2" style="width: 14px; height: 14px;"></i> ${bestScore}/${total}
                  </span>
                ` : `<span style="font-size: 0.75rem; color: #64748b; font-family: 'JetBrains Mono';">${isAr ? 'لم يبدأ' : 'Not Started'}</span>`}
              </div>
              <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem;">
                ${isAr ? q.titleAr : q.titleEn}
              </h3>
              <p style="font-size: 0.8rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1rem;">
                ${isAr ? q.descAr : q.descEn}
              </p>
            </div>
            <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 0.85rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; font-family: 'JetBrains Mono';">
              <span><i data-lucide="help-circle" style="width: 13px; height: 13px; vertical-align: -2px;"></i> ${total} ${isAr ? 'سؤال' : 'Questions'}</span>
              <span style="color: #818cf8; font-weight: 600; display: flex; align-items: center; gap: 4px;">
                ${isDone ? (isAr ? 'إعادة المحاولة' : 'Retake') : (isAr ? 'بدء الاختبار' : 'Start Quiz')} →
              </span>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div style="text-align: center; max-width: 600px; margin: 0 auto 2.5rem auto;">
          <h1 style="font-size: 2.25rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; letter-spacing: -0.02em;">
            ${isAr ? 'اختبارات التدريب العملي' : 'Practice Quizzes'}
          </h1>
          <p style="font-size: 1rem; color: #94a3b8;">
            ${isAr ? 'اختبر نفسك وتعلّم من أخطائك بدقة' : 'Test yourself and learn from your mistakes'}
          </p>
        </div>
        <div class="quiz-grid">
          ${cardsHtml}
        </div>
      `;
    }

    /* 2. Quiz Interface (1 Question at a time) */
    function renderQuizInterface(container) {
      const isAr = currentLanguage === 'ar';
      const quiz = QUIZZES.find(q => q.id === currentQuizId);
      const q = quiz.questions[currentQuestionIndex];
      const total = quiz.questions.length;
      const selected = userAnswers[q.id];
      const isLast = currentQuestionIndex === total - 1;

      let optionsHtml = '';
      q.options.forEach(opt => {
        const isSel = selected === opt.id;
        optionsHtml += `
          <button class="option-card ${isSel ? 'selected' : ''}" onclick="selectOption('${opt.id}')">
            <div style="display: flex; align-items: center;">
              <span class="option-letter">${opt.id}</span>
              <span style="font-size: 0.95rem; font-weight: 500;">${isAr ? opt.textAr : opt.text}</span>
            </div>
            <div style="width: 18px; height: 18px; border-radius: 9999px; border: 1.5px solid ${isSel ? '#6366f1' : 'rgba(255,255,255,0.2)'}; background: ${isSel ? '#6366f1' : 'transparent'}; display: flex; align-items: center; justify-content: center;">
              ${isSel ? '<i data-lucide="check" style="width: 12px; height: 12px; color: #fff; stroke-width: 3;"></i>' : ''}
            </div>
          </button>
        `;
      });

      // Question dots
      let dotsHtml = '';
      quiz.questions.forEach((item, idx) => {
        const isCurrent = idx === currentQuestionIndex;
        const isAns = userAnswers[item.id] !== undefined;
        let c = 'dot-btn';
        if (isCurrent) c += ' current';
        else if (isAns) c += ' answered';
        dotsHtml += `<button class="${c}" onclick="jumpToQuestion(${idx})">${idx + 1}</button>`;
      });

      container.innerHTML = `
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
          <div>
            <div style="font-family: 'JetBrains Mono'; font-size: 0.75rem; color: #818cf8; font-weight: 700;">
              ${isAr ? 'اختبار ' + quiz.id : 'QUIZ 0' + quiz.id}
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff;">
              ${isAr ? quiz.titleAr : quiz.titleEn}
            </h2>
          </div>
          <div style="font-family: 'JetBrains Mono'; font-size: 0.85rem; font-weight: 700; color: #c7d2fe;">
            ${isAr ? `السؤال ${currentQuestionIndex + 1} من ${total}` : `Question ${currentQuestionIndex + 1} of ${total}`}
          </div>
        </div>

        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; margin-bottom: 1.5rem;">
          <h3 style="font-size: 1.15rem; font-weight: 600; color: #fff; margin-bottom: 1.5rem; line-height: 1.6;">
            ${isAr ? q.questionAr : q.questionEn}
          </h3>

          <div style="margin-top: 1rem;">

    function selectOption(optId) {
      const quiz = QUIZZES.find(q => q.id === currentQuizId);
      const q = quiz.questions[currentQuestionIndex];
      userAnswers[q.id] = optId;
      renderCurrentView();
    }

    function nextQuestion() {
      const quiz = QUIZZES.find(q => q.id === currentQuizId);
      if (currentQuestionIndex === quiz.questions.length - 1) {
        submitQuiz();
      } else {
        currentQuestionIndex++;
        renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(idx) {
      currentQuestionIndex = idx;
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitQuiz() {
      const quiz = QUIZZES.find(q => q.id === currentQuizId);
      let score = 0;
      quiz.questions.forEach(q => {
        if (userAnswers[q.id] === q.correctAnswer) {
          score++;
        }
      });
      saveProgress(quiz.id, score, quiz.questions.length);
      currentView = 'results';
      updateLanguageUI();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
