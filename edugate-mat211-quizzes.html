 العلوية (0.8621) ينتج 0.7242."}},{"id":17,"question":"The Central Limit Theorem states that as $n \\to \\infty$, the standardized distribution of $Z = \\frac{\\bar{X} - \\mu}{\\sigma/\\sqrt{n}}$ approaches:","questionAr":"تنص نظرية النهاية المركزية (CLT) على أنه عندما يقترب $n$ من اللانهاية، فإن التوزيع المعياري لـ $Z$ يقترب من:","options":["A) A binomial distribution","B) A Poisson distribution","C) The standard normal distribution","D) A chi-square distribution"],"optionsAr":["A) توزيع ذي الحدين","B) توزيع بواسون","C) التوزيع الطبيعي المعياري (The standard normal distribution)","D) توزيع كاي تربيع"],"correct":"C","explanation":{"concept":"Central Limit Theorem (CLT)","conceptAr":"نظرية النهاية المركزية (Central Limit Theorem)","steps":["Regardless of the shape of the underlying population distribution (symmetric, skewed, or uniform), as sample size $n$ becomes sufficiently large ($n \\ge 30$):","The sampling distribution of the sample mean $\\bar{X}$ becomes approximately normal with mean $\\mu$ and standard error $\\frac{\\sigma}{\\sqrt{n}}$.","Standardizing gives $Z = \\frac{\\bar{X} - \\mu}{\\sigma/\\sqrt{n}} \\to N(0, 1)$."],"stepsAr":["بغض النظر عن شكل توزيع مجتمع الدراسة الأصلي، عندما يكون حجم العينة كبيراً ($n \\ge 30$):","فإن التوزيع العيني لمتوسط العينة $\\bar{X}$ يقترب من التوزيع الطبيعي بمتوسط $\\mu$ وخطأ معياري $\\frac{\\sigma}{\\sqrt{n}}$.","وعند التعيير يقترب من التوزيع الطبيعي المعياري $N(0, 1)$."],"whyWrong":"The CLT guarantees convergence specifically to the normal distribution $N(0,1)$, not discrete distributions.","whyWrongAr":"النظرية تضمن التقارب نحو التوزيع الطبيعي المعياري تحديداً."}},{"id":18,"question":"A numerical quantity that describes a characteristic of an entire population is called a:","questionAr":"المقدار العددي الذي يصف خاصية أو سمة لمجتمع الدراسة بأكمله يُسمى:","options":["A) Statistic","B) Parameter","C) Sample","D) Variable"],"optionsAr":["A) إحصاءة (Statistic)","B) معلمة (Parameter)","C) عينة (Sample)","D) متغير (Variable)"],"correct":"B","explanation":{"concept":"Parameter vs. Statistic","conceptAr":"المعلمة (Parameter) مقابل الإحصاءة (Statistic)","steps":["Memory tip: Population $\\to$ Parameter (both start with P).","Sample $\\to$ Statistic (both start with S).","A parameter is a fixed, usually unknown constant describing a population (e.g. $\\mu, \\sigma, p$)."],"stepsAr":["قاعدة للتذكر: المجتمع (Population) يقابله المعلمة (Parameter).","العينة (Sample) يقابلها الإحصاءة (Statistic).","المعلمة هي خاصية رقمية تصف المجتمع ككل وتكون ثابتة غالباً وغير معلومة."],"whyWrong":"A statistic describes a sample. A parameter describes the entire population.","whyWrongAr":"الإحصاءة تصف العينة، بينما المعلمة تصف مجتمع الدراسة كاملاً."}},{"id":19,"question":"The standard deviation of the sample mean $\\bar{X}$ (standard error) is:","questionAr":"الانحراف المعياري لمتوسط العينة $\\bar{X}$ (الخطأ المعياري) يُحسب بالصيغة:","options":["A) $\\sigma$","B) $\\sigma^2$","C) $\\frac{\\sigma}{\\sqrt{n}}$","D) $\\frac{\\sigma}{n}$"],"optionsAr":["A) $\\sigma$","B) $\\sigma^2$","C) $\\frac{\\sigma}{\\sqrt{n}}$ (الخطأ المعياري)","D) $\\frac{\\sigma}{n}$"],"correct":"C","explanation":{"concept":"Standard Error of the Mean","conceptAr":"الخطأ المعياري للوسط الحسابي","steps":["Variance of $\\bar{X}$ is $\\text{Var}(\\bar{X}) = \\frac{\\sigma^2}{n}$.","Taking the square root gives the Standard Error (SE): $\\sigma_{\\bar{X}} = \\frac{\\sigma}{\\sqrt{n}}$.","As $n$ increases, the standard error decreases by a factor of $\\sqrt{n}$."],"stepsAr":["تباين متوسط العينة هو $\\text{Var}(\\bar{X}) = \\frac{\\sigma^2}{n}$.","وبأخذ الجذر التربيعي نحصل على الخطأ المعياري: $\\sigma_{\\bar{X}} = \\frac{\\sigma}{\\sqrt{n}}$.","كلما كبر حجم العينة $n$، صغر الخطأ المعياري بمقدار $\\sqrt{n}$."],"whyWrong":"Dividing by $n$ lacks the square root. $\\sigma$ is the individual population standard deviation. SE is $\\sigma/\\sqrt{n}$.","whyWrongAr":"الانحراف المعياري للمجتمع هو $\\sigma$، أما الخطأ المعياري لمتوسط العينة فهو $\\sigma/\\sqrt{n}$."}},{"id":20,"question":"In the resistor example ($\\mu = 100, \\sigma = 10, n = 25$), $P(\\bar{X} < 95)$ equals:","questionAr":"في مثال المقاومات الكهربائية ($\\mu = 100, \\sigma = 10, n = 25$)، الاحتمال $P(\\bar{X} < 95)$ يساوي:","formula":"Z = \\frac{\\bar{X} - \\mu}{\\sigma / \\sqrt{n}}","options":["A) 0.0062","B) 0.1379","C) 0.7242","D) 0.0228"],"optionsAr":["A) 0.0062 (حيث z = −2.5)","B) 0.1379","C) 0.7242","D) 0.0228"],"correct":"A","explanation":{"concept":"Sampling Distribution Probability Calculation","conceptAr":"حساب احتمال التوزيع العيني لمتوسط العينة","steps":["Step 1: Standard error: $\\sigma_{\\bar{X}} = \\frac{\\sigma}{\\sqrt{n}} = \\frac{10}{\\sqrt{25}} = \\frac{10}{5} = 2$.","Step 2: Calculate $Z$ score: $Z = \\frac{95 - 100}{2} = \\frac{-5}{2} = -2.5$.","Step 3: Look up standard normal cumulative table for $Z = -2.5$:","$P(Z < -2.5) = 0.0062$ (or $0.62\\%$)."],"stepsAr":["الخطوة 1: حساب الخطأ المعياري: $\\sigma_{\\bar{X}} = \\frac{10}{\\sqrt{25}} = \\frac{10}{5} = 2$.","الخطوة 2: حساب الدرجة المعيارية: $Z = \\frac{95 - 100}{2} = -2.5$.","الخطوة 3: من جدول التوزيع الطبيعي المعياري عند $Z = -2.5$:","$P(Z < -2.5) = 0.0062$ (أي $0.62\\%$)."],"whyWrong":"If you forgot $\\sqrt{n}$ and divided by 10, you would get $z = -0.5$ ($P = 0.3085$). With correct SE = 2, $z = -2.5$ and $P = 0.0062$.","whyWrongAr":"الخطأ الشائع هو عدم قسمة الانحراف على جذر $n$. بقسمة 10 على 5 يكون الخطأ المعياري 2 و z = -2.5 والاحتمال 0.0062."}}]},{"id":"lecture-4-confidence-intervals","quizNumber":4,"lectureNumber":4,"title":"Lecture 4: Confidence Intervals","titleAr":"المحاضرة 4: فترات الثقة","subtitle":"Point estimation, margins of error, Z-critical values, sample size determination, and large sample CIs","subtitleAr":"التقدير بنقطة، هامش الخطأ، القيم الحرجة لـ Z، تحديد حجم العينة، وفترات ثقة العينات الكبيرة","difficulty":"Medium","questionCount":20,"questions":[{"id":1,"question":"A numerical summary of a sample is called a:","questionAr":"الموجز الرقمي المحسوب من بيانات العينة يُسمى:","options":["A) Parameter","B) Statistic","C) Population","D) Confidence level"],"optionsAr":["A) معلمة (Parameter)","B) إحصاءة (Statistic)","C) مجتمع (Population)","D) مستوى ثقة (Confidence level)"],"correct":"B","explanation":{"concept":"Sample Statistic Definition","conceptAr":"تعريف الإحصاءة (Statistic)","steps":["A Statistic is any numerical value calculated directly from sample observations (e.g., $\\bar{X}, s, p$).","It is a random variable that varies from one sample to another."],"stepsAr":["الإحصاءة (Statistic) هي أي مقياس رقمي يُحسب مباشرة من مفردات العينة (مثل $\\bar{X}, s, p$).","وهي متغير عشوائي يختلف من عينة إلى أخرى."],"whyWrong":"A parameter is a population quantity. A statistic is calculated from a sample.","whyWrongAr":"المعلمة للمجتمع، بينما الإحصاءة للعينة."}},{"id":2,"question":"A numerical summary of a population is called a:","questionAr":"الموجز أو المقياس الرقمي لمجتمع الدراسة بالكامل يُسمى:","options":["A) Statistic","B) Parameter","C) Point estimate","D) Sample mean"],"optionsAr":["A) إحصاءة (Statistic)","B) معلمة (Parameter)","C) تقدير بنقطة","D) وسط العينة"],"correct":"B","explanation":{"concept":"Population Parameter Definition","conceptAr":"تعريف المعلمة (Parameter)","steps":["A Parameter is a fixed, descriptive numerical summary of an entire population (e.g., $\\mu, \\sigma, \\sigma^2, P$).","In practice, parameters are typically unknown and estimated via sample statistics."],"stepsAr":["المعلمة (Parameter) هي مقياس وصفي ثابت يخص مجتمع الدراسة بأكمله (مثل $\\mu, \\sigma$).","في التطبيق العملي تكون المعالم مجهولة ويتم تقديرها من إحصاءات العينات."],"whyWrong":"A sample mean is a statistic. A parameter belongs solely to the population.","whyWrongAr":"متوسط العينة هو إحصاءة، بينما المعلمة تخص المجتمع فقط."}},{"id":3,"question":"A statistic used to estimate a parameter is called a:","questionAr":"تُسمى الإحصاءة المستخدمة لتقدير معلمة مجهولة بـ:","options":["A) Confidence interval","B) Margin of error","C) Point estimate","D) Significance level"],"optionsAr":["A) فترة ثقة (Confidence interval)","B) هامش خطأ (Margin of error)","C) تقدير بنقطة (Point estimate)","D) مستوى معنوية (Significance level)"],"correct":"C","explanation":{"concept":"Point Estimation","conceptAr":"التقدير بنقطة (Point Estimation)","steps":["A Point Estimate is a single numerical value computed from sample data used as the best guess for an unknown population parameter.","Example: $\\bar{X}$ is the point estimate for $\\mu$, and $s$ is the point estimate for $\\sigma$."],"stepsAr":["التقدير بنقطة هو قيمة عددية مفردة تُحسب من بيانات العينة وتعتبر أفضل تخمين لمعلمة المجتمع المجهولة.","مثال: متوسط العينة $\\bar{X}$ هو تقدير بنقطة لمتوسط المجتمع $\\mu$."],"whyWrong":"A confidence interval is a range of values, not a single point statistic.","whyWrongAr":"فترة الثقة تمثل مدى أو مجال من القيم، بينما التقدير بنقطة هو قيمة وحيدة."}},{"id":4,"question":"The sample mean $\\bar{X}$ and sample proportion $\\hat{p}$ are examples of:","questionAr":"يُمثِّل كل من متوسط العينة $\\bar{X}$ ونسبة العينة $\\hat{p}$ أمثلة على:","options":["A) Parameters","B) Point estimates","C) Confidence levels","D) Population variances"],"optionsAr":["A) معالم للمجتمع (Parameters)","B) تقديرات بنقطة (Point estimates)","C) مستويات ثقة","D) تباينات المجتمع"],"correct":"B","explanation":{"concept":"Examples of Point Estimators","conceptAr":"أمثلة على مقدرات النقطة","steps":["$\\bar{X}$ is a sample statistic used to estimate $\\mu$.","$\\hat{p} = \\frac{x}{n}$ is a sample statistic used to estimate population proportion $p$.","Both are primary examples of Point Estimates."],"stepsAr":["$\\bar{X}$ إحصاءة عينة لتقدير $\\mu$.","$\\hat{p}$ إحصاءة عينة لتقدير نسبة المجتمع $p$.","كلاهما يمثلان تقديرات بنقطة (Point estimates)."],"whyWrong":"They are computed from samples, so they are estimators/statistics, never population parameters.","whyWrongAr":"تُحسب من العينات وبالتالي هي إحصاءات وتقديرات وليست معالم مجتمع."}},{"id":5,"question":"The purpose of a confidence interval is to:","questionAr":"الهدف الأساسي من بناء فترة الثقة (Confidence Interval) هو:","options":["A) Replace the point estimate","B) Provide a margin of error for the point estimate","C) Eliminate sampling error","D) Calculate the population size"],"optionsAr":["A) استبدال التقدير بنقطة تماماً","B) توفير هامش خطأ ومدى للتقدير بنقطة (Provide a margin of error)","C) القضاء التام على خطأ المعاينة","D) حساب حجم المجتمع الكلي"],"correct":"B","explanation":{"concept":"Objective of Interval Estimation","conceptAr":"الهدف من التقدير بفترة ثقة","steps":["A point estimate almost never hits the exact true population parameter due to sampling variability.","A confidence interval surrounds the point estimate with a quantifiable margin of error: $\\text{Estimate} \\pm E$, indicating the precision and reliability of the estimate."],"stepsAr":["التقدير بنقطة نادراً ما يطابق معلمة المجتمع الحقيقية تماماً بسبب أخطاء المعاينة العشوائية.","توفر فترة الثقة نطاقاً محاطاً بهامش خطأ مقاس: $\\text{التقدير} \\pm E$ لتحديد مدى الدقة والموثوقية."],"whyWrong":"Sampling error cannot be eliminated. Confidence intervals quantify the margin of error surrounding the point estimate.","whyWrongAr":"لا يمكن إزالة خطأ المعاينة، وفترة الثقة تهدف لتحديد هامش الخطأ ومقدار عدم اليقين."}},{"id":6,"question":"A two-sided confidence interval for the population mean generally has the form:","questionAr":"تأخذ فترة الثقة ثنائية الجانب لمتوسط المجتمع عموماً الصيغة الرياضية:","options":["A) Point Estimate × Margin of Error","B) Point Estimate ± Margin of Error","C) Point Estimate ÷ Margin of Error","D) Margin of Error ± Point Estimate"],"optionsAr":["A) التقدير بنقطة × هامش الخطأ","B) التقدير بنقطة ± هامش الخطأ (Point Estimate ± Margin of Error)","C) التقدير بنقطة ÷ هامش الخطأ","D) هامش الخطأ ± التقدير بنقطة"],"correct":"B","explanation":{"concept":"Confidence Interval Canonical Form","conceptAr":"الشكل العام المعتمد لفترة الثقة","steps":["Lower Limit: $\\text{Point Estimate} - \\text{Margin of Error}$","Upper Limit: $\\text{Point Estimate} + \\text{Margin of Error}$","Compact notation: $\\text{Point Estimate} \\pm \\text{Margin of Error}$ (e.g., $\\bar{X} \\pm z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$)."],"stepsAr":["الحد الأدنى: $\\text{التقدير بنقطة} - \\text{هامش الخطأ}$","الحد الأعلى: $\\text{التقدير بنقطة} + \\text{هامش الخطأ}$","الصيغة المختصرة: $\\text{Point Estimate} \\pm \\text{Margin of Error}$."],"whyWrong":"Intervals are additive and subtractive bounds centered on the point estimate.","whyWrongAr":"فترة الثقة تنبني على الجمع والطرح المتناظر لهامش الخطأ حول التقدير بنقطة."}},{"id":7,"question":"A confidence level of $100(1-\\alpha)\\%$ corresponds to a significance level of:","questionAr":"مستوى ثقة مقداره $100(1 - \\alpha)\\%$ يقابله مستوى معنوية (دلالة) مقداره:","options":["A) $1 - \\alpha$","B) $\\alpha$","C) $\\alpha/2$","D) $2\\alpha$"],"optionsAr":["A) $1 - \\alpha$","B) $\\alpha$ (مستوى المعنوية)","C) $\\alpha/2$","D) $2\\alpha$"],"correct":"B","explanation":{"concept":"Confidence Level vs. Significance Level","conceptAr":"مستوى الثقة مقابل مستوى المعنوية","steps":["Confidence level $= 1 - \\alpha$.","Significance level $= \\alpha$.","For example: $95\\%$ confidence corresponds to $\\alpha = 1 - 0.95 = 0.05$ ($5\\%$)."],"stepsAr":["مستوى الثقة $= 1 - \\alpha$.","مستوى المعنوية $= \\alpha$.","مثال: مستوى ثقة $95\\%$ يقابله مستوى معنوية $\\alpha = 1 - 0.95 = 0.05$ ($5\\%$)."],"whyWrong":"$\\alpha$ is the significance level (risk of error). $\\alpha/2$ is the probability in each individual tail.","whyWrongAr":"$\\alpha$ هو مستوى المعنوية الإجمالي، بينما $\\alpha/2$ هو احتمال كل ذيل بمفرده."}},{"id":8,"question":"Which of the following is NOT a common confidence level in statistical practice?","questionAr":"أي من النسب التالية لا يُعتبر مستوى ثقة شائع الاستخدام في الممارسات الإحصائية القياسية؟","options":["A) 90%","B) 95%","C) 99%","D) 75%"],"optionsAr":["A) 90%","B) 95%","C) 99%","D) 75% (ليس مستوى شائعاً)"],"correct":"D","explanation":{"concept":"Standard Confidence Levels","conceptAr":"مستويات الثقة القياسية المعتمدة","steps":["The three universally accepted standard confidence levels in science and industry are $90\\%$, $95\\%$, and $99\\%$.","A $75\\%$ confidence level leaves a $25\\%$ probability of error, which is unacceptably high for scientific conclusions."],"stepsAr":["المستويات القياسية المتعارف عليها دولياً في البحوث هي $90\\%$ و $95\\%$ و $99\\%$.","مستوى $75\\%$ يترك هامش مخاطرة $25\\%$ وهو غير مقبول علمياً."],"whyWrong":"90%, 95%, and 99% are standard textbook benchmarks. 75% is never used as a standard benchmark.","whyWrongAr":"مستويات 90 و 95 و 99 هي المستويات الشائعة، و 75% نادراً ما يُستخدم."}},{"id":9,"question":"For a large sample size ($n \\ge 30$), the confidence interval for $\\mu$ uses:","questionAr":"للعينات الكبيرة بحجم ($n \\ge 30$)، فإن فترة الثقة لمتوسط المجتمع $\\mu$ تستخدم:","options":["A) The t-distribution","B) The z-distribution (standard normal)","C) The chi-square distribution","D) The F-distribution"],"optionsAr":["A) توزيع تي ستيودنت (t-distribution)","B) توزيع Z الطبيعي المعياري (Standard normal)","C) توزيع كاي تربيع","D) توزيع F"],"correct":"B","explanation":{"concept":"Large Sample Inference Distribution","conceptAr":"توزيع الاستدلال للعينات الكبيرة","steps":["By the Central Limit Theorem, when $n \\ge 30$, the sample mean $\\bar{X}$ is approximately normally distributed regardless of population shape.","Therefore, critical values are taken from the standard normal $Z$-distribution ($z_{\\alpha/2}$)."],"stepsAr":["استناداً لنظرية النهاية المركزية، عندما $n \\ge 30$ يقترب توزيع متوسط العينة من التوزيع الطبيعي.","لذا تُستخدم القيم الحرجة من توزيع $Z$ الطبيعي المعياري ($z_{\\alpha/2}$)."],"whyWrong":"The t-distribution is required for small samples ($n < 30$) when $\\sigma$ is unknown. For $n \\ge 30$, the z-distribution is used.","whyWrongAr":"توزيع تي مخصص للعينات الصغيرة ($n < 30$)، أما للعينات الكبيرة فنستخدم توزيع Z."}},{"id":10,"question":"The standard error of the sample mean is given by:","questionAr":"الخطأ المعياري لمتوسط العينة يُعطى بالصيغة:","options":["A) $\\sigma \\cdot \\sqrt{n}$","B) $\\frac{\\sigma}{\\sqrt{n}}$","C) $\\frac{\\sigma^2}{n}$","D) $\\frac{s^2}{\\sqrt{n}}$"],"optionsAr":["A) $\\sigma \\cdot \\sqrt{n}$","B) $\\frac{\\sigma}{\\sqrt{n}}$","C) $\\frac{\\sigma^2}{n}$","D) $\\frac{s^2}{\\sqrt{n}}$"],"correct":"B","explanation":{"concept":"Standard Error Formula","conceptAr":"قانون الخطأ المعياري","steps":["The standard deviation of the sampling distribution of $\\bar{X}$ is:","$\\sigma_{\\bar{X}} = \\frac{\\sigma}{\\sqrt{n}}$","When population standard deviation $\\sigma$ is unknown, it is estimated using sample standard deviation: $\\frac{s}{\\sqrt{n}}$."],"stepsAr":["الانحراف المعياري لمتوسطات العينات يُسمى الخطأ المعياري ويعطى بـ:","$\\sigma_{\\bar{X}} = \\frac{\\sigma}{\\sqrt{n}}$ أو $\\frac{s}{\\sqrt{n}}$."],"whyWrong":"Multiplying by $\\sqrt{n}$ inflates the spread; dividing by $n$ lacks the square root. $\\sigma/\\sqrt{n}$ is the exact formula.","whyWrongAr":"الضرب في $\\sqrt{n}$ خاطئ، والقسمة بدون جذر خاطئة، والقانون الصحيح هو $\\sigma/\\sqrt{n}$."}},{"id":11,"question":"$\\bar{X} \\pm 1.645 \\frac{s}{\\sqrt{n}}$ is a:","questionAr":"الصيغة $\\bar{X} \\pm 1.645 \\frac{s}{\\sqrt{n}}$ تمثل فترة ثقة بمستوى:","options":["A) 68% confidence interval","B) 90% confidence interval","C) 95% confidence interval","D) 99% confidence interval"],"optionsAr":["A) فترة ثقة 68%","B) فترة ثقة 90% (90% confidence interval)","C) فترة ثقة 95%","D) فترة ثقة 99%"],"correct":"B","explanation":{"concept":"Critical Value for 90% Confidence","conceptAr":"القيمة الحرجة لمستوى ثقة 90%","steps":["For a $90\\%$ confidence interval, $\\alpha = 1 - 0.90 = 0.10$.","Tail probability in each side: $\\alpha/2 = 0.05$.","From standard normal tables: $z_{0.05} = 1.645$.","Hence, $\\bar{X} \\pm 1.645 \\frac{s}{\\sqrt{n}}$ is a $90\\%$ confidence interval."],"stepsAr":["لمستوى ثقة $90\\%$، يكون $\\alpha = 0.10$.","المساحة في كل طرف: $\\alpha/2 = 0.05$.","من جدول Z: $z_{0.05} = 1.645$.","وبالتالي فإن هامش الخطأ $1.645 \\frac{s}{\\sqrt{n}}$ يخص مستوى ثقة $90\\%$."],"whyWrong":"95% uses 1.96, and 99% uses 2.58. 1.645 corresponds specifically to 90%.","whyWrongAr":"95% تستخدم 1.96 و 99% تستخدم 2.58، بينما 1.645 مخصصة لمستوى 90%."}},{"id":12,"question":"$\\bar{X} \\pm 1.96 \\frac{s}{\\sqrt{n}}$ is a:","questionAr":"الصيغة $\\bar{X} \\pm 1.96 \\frac{s}{\\sqrt{n}}$ تمثل فترة ثقة بمستوى:","options":["A) 68% confidence interval","B) 90% confidence interval","C) 95% confidence interval","D) 99% confidence interval"],"optionsAr":["A) فترة ثقة 68%","B) فترة ثقة 90%","C) فترة ثقة 95% (95% confidence interval)","D) فترة ثقة 99%"],"correct":"C","explanation":{"concept":"Critical Value for 95% Confidence","conceptAr":"القيمة الحرجة لمستوى ثقة 95%","steps":["For a $95\\%$ confidence interval, $\\alpha = 0.05$ and $\\alpha/2 = 0.025$.","The cumulative area up to $z_{0.025}$ is $0.9750$, which corresponds to $z = 1.96$.","Therefore, $\\bar{X} \\pm 1.96 \\frac{s}{\\sqrt{n}}$ is the standard $95\\%$ CI."],"stepsAr":["لمستوى ثقة $95\\%$، يكون $\\alpha = 0.05$ وبالتالي $\\alpha/2 = 0.025$.","المساحة التراكمية $0.9750$ تقابلها القيمة الحرجة $z = 1.96$.","وبالتالي فهذه فترة ثقة بمستوى $95\\%$."],"whyWrong":"1.96 is the classic, most famous z-multiplier for a 95% confidence interval.","whyWrongAr":"القيمة 1.96 هي المعامل القياسي لفترة الثقة 95%."}},{"id":13,"question":"$\\bar{X} \\pm 2.58 \\frac{s}{\\sqrt{n}}$ is a:","questionAr":"الصيغة $\\bar{X} \\pm 2.58 \\frac{s}{\\sqrt{n}}$ تمثل فترة ثقة بمستوى:","options":["A) 68% confidence interval","B) 90% confidence interval","C) 95% confidence interval","D) 99% confidence interval"],"optionsAr":["A) فترة ثقة 68%","B) فترة ثقة 90%","C) فترة ثقة 95%","D) فترة ثقة 99% (99% confidence interval)"],"correct":"D","explanation":{"concept":"Critical Value for 99% Confidence","conceptAr":"القيمة الحرجة لمستوى ثقة 99%","steps":["For $99\\%$ confidence level, $\\alpha = 0.01$ and $\\alpha/2 = 0.005$.","From standard normal tables: $z_{0.005} \\approx 2.576$ (commonly rounded to $2.58$).","Therefore, the multiplier $2.58$ creates a $99\\%$ confidence interval."],"stepsAr":["لمستوى ثقة $99\\%$، يكون $\\alpha = 0.01$ و $\\alpha/2 = 0.005$.","من جدول Z: $z_{0.005} \\approx 2.58$.","لذا فإن المعامل 2.58 يخص فترة ثقة $99\\%$."],"whyWrong":"2.58 captures 99% of the distribution area between $[-2.58, +2.58]$.","whyWrongAr":"المعامل 2.58 يحصر 99% من المساحة تحت المنحنى الطبيعي."}},{"id":14,"question":"For the battery example ($\\bar{X} = 185.5$, $s = 5.0$, $n = 100$), the standard error is:","questionAr":"لمثال بطاريات السيارات ($\\bar{X} = 185.5$, $s = 5.0$, $n = 100$)، فإن الخطأ المعياري يساوي:","formula":"\\text{SE} = \\frac{s}{\\sqrt{n}}","options":["A) 5.0","B) 0.5","C) 0.05","D) 1.0"],"optionsAr":["A) 5.0","B) 0.5 (s / \\sqrt{n} = 5/10)","C) 0.05","D) 1.0"],"correct":"B","explanation":{"concept":"Standard Error Computation","conceptAr":"حساب الخطأ المعياري للعينة","steps":["Sample standard deviation $s = 5.0$","Sample size $n = 100 \\implies \\sqrt{n} = \\sqrt{100} = 10$","$\\text{SE} = \\frac{s}{\\sqrt{n}} = \\frac{5.0}{10} = 0.5$"],"stepsAr":["الانحراف المعياري للعينة $s = 5.0$","حجم العينة $n = 100 \\implies \\sqrt{n} = 10$","الخطأ المعياري: $\\text{SE} = \\frac{5.0}{10} = 0.5$"],"whyWrong":"5.0 is the raw standard deviation $s$. Dividing by $\\sqrt{100} = 10$ yields 0.5.","whyWrongAr":"5.0 هو الانحراف المعياري للعينة، وبقسمته على جذر 100 ينتج 0.5."}},{"id":15,"question":"For an 85% confidence interval, $\\alpha/2$ equals:","questionAr":"لفترة ثقة بمستوى 85%، فإن قيمة $\\alpha/2$ تساوي:","options":["A) 0.15","B) 0.075","C) 0.025","D) 0.05"],"optionsAr":["A) 0.15","B) 0.075","C) 0.025","D) 0.05"],"correct":"B","explanation":{"concept":"Two-Tailed Alpha Division","conceptAr":"تقسيم مستوى المعنوية على طرفي التوزيع","steps":["Confidence level $= 85\\% = 0.85$.","Significance level: $\\alpha = 1 - 0.85 = 0.15$.","Dividing by 2 for a two-sided interval: $\\frac{\\alpha}{2} = \\frac{0.15}{2} = 0.075$."],"stepsAr":["مستوى الثقة $= 0.85$.","مستوى المعنوية: $\\alpha = 1 - 0.85 = 0.15$.","القسمة على 2 للفترة ثنائية الطرف: $\\frac{\\alpha}{2} = \\frac{0.15}{2} = 0.075$."],"whyWrong":"0.15 is the total $\\alpha$. For a two-sided interval, $\\alpha$ must be split equally between both tails: $0.15/2 = 0.075$.","whyWrongAr":"0.15 هو إجمالي $\\alpha$ للطرفين معاً، ولكل طرف بمفرده نقسم على 2 لنحصل على 0.075."}},{"id":16,"question":"The critical value $z_{0.075}$ for an 85% confidence interval is:","questionAr":"القيمة الحرجة $z_{0.075}$ لفترة ثقة 85% تساوي:","options":["A) 1.96","B) 1.645","C) 1.44","D) 2.58"],"optionsAr":["A) 1.96","B) 1.645","C) 1.44","D) 2.58"],"correct":"C","explanation":{"concept":"Finding Non-Standard Z-Critical Values","conceptAr":"إيجاد القيمة الحرجة من جدول Z","steps":["We need the $Z$ value where the upper tail area is $0.075$.","Cumulative probability to the left: $1 - 0.075 = 0.9250$.","Locating $0.9250$ in the standard normal table gives $Z = 1.44$."],"stepsAr":["نبحث عن قيمة $Z$ التي تجعل مساحة الذيل الأيمن $0.075$.","المساحة التراكمية على اليسار: $1 - 0.075 = 0.9250$.","بالبحث عن القيمة $0.9250$ في جدول Z نجد أنها تقابل $Z = 1.44$."],"whyWrong":"1.96 is for 95%, 1.645 is for 90%, and 2.58 is for 99%. 1.44 corresponds to 85%.","whyWrongAr":"1.96 لـ 95% و 1.645 لـ 90%، بينما 1.44 تقابل مساحة 85% بدقة."}},{"id":17,"question":"For the battery example ($\\bar{X} = 185.5, s = 5.0, n = 100, z_{0.075} = 1.44$), the 85% confidence interval is:","questionAr":"لمثال البطاريات ($\\bar{X} = 185.5, s = 5.0, n = 100, z_{0.075} = 1.44$)، فإن فترة الثقة 85% هي:","formula":"\\text{CI} = \\bar{X} \\pm z_{\\alpha/2} \\left(\\frac{s}{\\sqrt{n}}\\right)","options":["A) (184.78, 186.22)","B) (184.50, 186.50)","C) (185.00, 186.00)","D) (184.28, 186.72)"],"optionsAr":["A) (184.78, 186.22)","B) (184.50, 186.50)","C) (185.00, 186.00)","D) (184.28, 186.72)"],"correct":"A","explanation":{"concept":"85% Confidence Interval Calculation","conceptAr":"حساب فترة الثقة 85%","steps":["Point estimate: $\\bar{X} = 185.5$.","Standard error: $\\text{SE} = \\frac{5}{10} = 0.5$.","Critical value: $z_{0.075} = 1.44$.","Margin of error: $E = 1.44 \\times 0.5 = 0.72$.","Interval: $185.5 \\pm 0.72 = (185.5 - 0.72, 185.5 + 0.72) = (184.78, 186.22)$."],"stepsAr":["التقدير بنقطة: $\\bar{X} = 185.5$.","الخطأ المعياري: $\\text{SE} = 0.5$.","القيمة الحرجة: $z = 1.44$.","هامش الخطأ: $E = 1.44 \\times 0.5 = 0.72$.","فترة الثقة: $185.5 \\pm 0.72 = (184.78, 186.22)$."],"whyWrong":"Adding and subtracting 0.72 from 185.5 gives (184.78, 186.22).","whyWrongAr":"بطرح وإضافة 0.72 من 185.5 نحصل على الفترة (184.78, 186.22)."}},{"id":18,"question":"In Example 2.2 ($\\bar{x} = 5, \\sigma^2 = 9, n = 100$), the 95% confidence interval is:","questionAr":"في المثال 2.2 ($\\bar{x} = 5, \\sigma^2 = 9, n = 100$)، فإن فترة الثقة 95% هي:","formula":"\\text{CI} = \\bar{X} \\pm z_{\\alpha/2} \\left(\\frac{\\sigma}{\\sqrt{n}}\\right)","options":["A) (4.412, 5.588)","B) (4.500, 5.500)","C) (4.706, 5.294)","D) (3.412, 6.588)"],"optionsAr":["A) (4.412, 5.588)","B) (4.500, 5.500)","C) (4.706, 5.294)","D) (3.412, 6.588)"],"correct":"A","explanation":{"concept":"95% Confidence Interval with Known Variance","conceptAr":"حساب فترة الثقة 95% مع تباين معلوم","steps":["Given variance $\\sigma^2 = 9 \\implies \\sigma = \\sqrt{9} = 3$.","Sample size $n = 100 \\implies \\sqrt{n} = 10$.","Standard error: $\\frac{\\sigma}{\\sqrt{n}} = \\frac{3}{10} = 0.3$.","Margin of error for $95\\%$ ($z = 1.96$): $E = 1.96 \\times 0.3 = 0.588$.","Interval: $5 \\pm 0.588 = (4.412, 5.588)$."],"stepsAr":["التباين $\\sigma^2 = 9 \\implies$ الانحراف المعياري $\\sigma = 3$.","جذر العينة: $\\sqrt{100} = 10$.","الخطأ المعياري: $\\frac{3}{10} = 0.3$.","هامش الخطأ: $E = 1.96 \\times 0.3 = 0.588$.","فترة الثقة: $5 \\pm 0.588 = (4.412, 5.588)$."],"whyWrong":"A common pitfall is using $\\sigma^2=9$ directly instead of taking $\\sqrt{9}=3$. With $\\sigma=3$, the interval is (4.412, 5.588).","whyWrongAr":"الخطأ الشائع هو استخدام التباين 9 بدلاً من جذره 3. الانحراف 3 يعطي هامش خطأ 0.588."}},{"id":19,"question":"The margin of error $E$ of a confidence interval for $\\mu$ is:","questionAr":"هامش الخطأ $E$ لفترة الثقة لمتوسط المجتمع $\\mu$ يُحسب بالصيغة:","options":["A) $\\bar{X} + z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$","B) $z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$","C) $\\frac{\\sigma}{\\sqrt{n}}$","D) $z_{\\alpha/2}\\sigma$"],"optionsAr":["A) $\\bar{X} + z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$","B) $z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$","C) $\\frac{\\sigma}{\\sqrt{n}}$","D) $z_{\\alpha/2}\\sigma$"],"correct":"B","explanation":{"concept":"Margin of Error Definition and Formula","conceptAr":"تعريف وقانون هامش الخطأ","steps":["The margin of error $E$ is the maximum expected discrepancy between the true parameter $\\mu$ and point estimate $\\bar{X}$ at the chosen confidence level.","Formula: $E = z_{\\alpha/2} \\cdot \\text{SE} = z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$."],"stepsAr":["هامش الخطأ $E$ هو المقدار الذي يضاف ويطرح من التقدير بنقطة لتحديد اتساع الفترة.","الصيغة: $E = z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}}$."],"whyWrong":"Option A is the upper bound. Option C is only the standard error without the critical multiplier.","whyWrongAr":"A هو الحد الأعلى للفترة، و C هو الخطأ المعياري فقط دون ضربه بالقيمة الحرجة."}},{"id":20,"question":"To obtain a 99% confidence interval of width $\\pm 1.0\\text{ A}$ (with $s = 5.0$), the required sample size is approximately:","questionAr":"للحصول على فترة ثقة 99% بهامش خطأ قدره $\\pm 1.0\\text{ A}$ (مع انحراف معياري $s = 5.0$)، فإن حجم العينة المطلوب تقريباً هو:","formula":"n = \\left(\\frac{z_{\\alpha/2} \\cdot s}{E}\\right)^2","options":["A) 100","B) 167","C) 25","D) 250"],"optionsAr":["A) 100","B) 167 (باستخدام قانون n = z² s² / E²)","C) 25","D) 250"],"correct":"B","explanation":{"concept":"Sample Size Determination Formula","conceptAr":"تحديد حجم العينة المطلوب لهامش خطأ محدد","steps":["From margin of error: $E = z_{\\alpha/2} \\frac{s}{\\sqrt{n}} \\implies \\sqrt{n} = \\frac{z_{\\alpha/2} s}{E} \\implies n = \\left(\\frac{z_{\\alpha/2} s}{E}\\right)^2$.","Parameters: $99\\%$ confidence $\\implies z_{0.005} = 2.58$ (or $2.576$).","Desired error bound: $E = 1.0$, standard deviation: $s = 5.0$.","Calculation: $n = \\left(\\frac{2.58 \\times 5.0}{1.0}\\right)^2 = (12.9)^2 = 166.41$.","Always round up to the next integer: $n = 167$."],"stepsAr":["من قانون هامش الخطأ: $n = \\left(\\frac{z_{\\alpha/2} s}{E}\\right)^2$.","المعطيات: ثقة $99\\% \\implies z = 2.58$، $s = 5.0$، $E = 1.0$.","الحساب: $n = (2.58 \\times 5.0)^2 = (12.9)^2 = 166.41$.","يُقرب حجم العينة دائماً للأعلى إلى أقرب عدد صحيح: $n = 167$."],"whyWrong":"Squaring 12.9 gives 166.41, which rounds up to 167. 100 is the sample size from the earlier example.","whyWrongAr":"مربع 12.9 يساوي 166.41، ونقرب دائماً للأعلى لضمان مستوى الدقة المطلوب فيكون 167."}}]},{"id":"lecture-5-confidence-intervals-part-2","quizNumber":5,"lectureNumber":5,"title":"Lecture 5: Confidence Intervals Part 2","titleAr":"المحاضرة 5: فترات الثقة (الجزء الثاني)","subtitle":"Student's t-distribution, small samples, two-sample differences, pooled variance, and degrees of freedom","subtitleAr":"توزيع تي ستيودنت، العينات الصغيرة، الفرق بين متوسطي مجتمعين، التباين المشترك، ودرجات الحرية","difficulty":"Hard","questionCount":20,"questions":[{"id":1,"question":"For large samples ($n \\ge 30$), the sampling distribution of $\\bar{X}$ is approximately normal due to:","questionAr":"للعينات الكبيرة ($n \\ge 30$)، يقترب التوزيع العيني لـ $\\bar{X}$ من التوزيع الطبيعي نتيجة لـ:","options":["A) The t-distribution","B) The Central Limit Theorem","C) The pooled variance","D) The chi-square distribution"],"optionsAr":["A) توزيع تي","B) نظرية النهاية المركزية (The Central Limit Theorem)","C) التباين المشترك (Pooled variance)","D) توزيع كاي تربيع"],"correct":"B","explanation":{"concept":"Central Limit Theorem Foundation","conceptAr":"أساس نظرية النهاية المركزية","steps":["The Central Limit Theorem (CLT) is the fundamental statistical principle that states that regardless of the population distribution, the sampling distribution of $\\bar{X}$ becomes approximately normal as $n \\ge 30$."],"stepsAr":["نظرية النهاية المركزية (CLT) هي القاعدة الرياضية التي تنص على تقارب توزيع متوسطات العينات من التوزيع الطبيعي عندما يكون $n \\ge 30$."],"whyWrong":"The t-distribution is used for small samples. It is the Central Limit Theorem that justifies normal approximation for large samples.","whyWrongAr":"توزيع تي مخصص للعينات الصغيرة، بينما نظرية النهاية المركزية هي التي تفسر التقارب الطبيعي للعينات الكبيرة."}},{"id":2,"question":"For small samples ($n < 30$) when population variance is unknown, which distribution is used for confidence intervals?","questionAr":"للعينات الصغيرة ($n < 30$) عندما يكون تباين المجتمع مجهولاً، أي توزيع احتمالي يُستخدم لبناء فترات الثقة؟","options":["A) Standard normal Z-distribution","B) Student's t-distribution","C) Chi-square distribution","D) F-distribution"],"optionsAr":["A) توزيع Z الطبيعي المعياري","B) توزيع تي ستيودنت (Student's t-distribution)","C) توزيع كاي تربيع","D) توزيع F"],"correct":"B","explanation":{"concept":"Student's t-Distribution for Small Samples","conceptAr":"توزيع تي ستيودنت للعينات الصغيرة","steps":["When $n < 30$ and the population is normal with unknown $\\sigma$ (estimated by sample standard deviation $s$):","The sampling distribution follows Student's $t$-distribution with $n - 1$ degrees of freedom."],"stepsAr":["عندما يكون حجم العينة صغيراً $n < 30$ مع مجتمع طبيعي وانحراف معياري مجهول $\\sigma$ يُقدر بـ $s$:","فإن التوزيع العيني يتبع توزيع تي ستيودنت بدرجات حرية $n - 1$."],"whyWrong":"The standard normal Z requires a known $\\sigma$ or large $n$. For small samples with unknown $\\sigma$, Student's t-distribution is necessary.","whyWrongAr":"توزيع Z يتطلب عينات كبيرة أو انحراف مجتمع معلوم. في العينات الصغيرة ذات الانحراف المجهول يجب استخدام توزيع t."}},{"id":3,"question":"For a small sample, the degrees of freedom for the t-distribution is:","questionAr":"لعينة صغيرة مفردة بحجم $n$، تكون درجات الحرية (df) لتوزيع تي مساوية لـ:","options":["A) n","B) n + 1","C) n − 1","D) n − 2"],"optionsAr":["A) n","B) n + 1","C) n − 1 (درجات الحرية)","D) n − 2"],"correct":"C","explanation":{"concept":"Degrees of Freedom (df) for One-Sample t-Test","conceptAr":"درجات الحرية لعينة واحدة في توزيع t","steps":["Degrees of freedom represents the number of independent pieces of information in the calculation of $s$.","Since $\\bar{X}$ is calculated from the $n$ observations, one degree of freedom is lost to the constraint $\\sum (X_i - \\bar{X}) = 0$.","Thus: $\\text{df} = n - 1$."],"stepsAr":["تعبر درجات الحرية عن عدد المشاهدات المستقلة المتبقية لحساب الانحراف المعياري $s$.","نظراً لثبات الوسط $\\bar{X}$ فإننا نفقد قيداً واحداً حيث $\\sum (X_i - \\bar{X}) = 0$.","وبالتالي: $\\text{df} = n - 1$."],"whyWrong":"$n-2$ is used for two-sample pooled tests. For a single sample, $\\text{df} = n - 1$.","whyWrongAr":"$n-2$ تُستخدم لعينتين في التباين المشترك، أما للعينة الواحدة فدرجات الحرية هي $n-1$."}},{"id":4,"question":"The t-distribution is:","questionAr":"يتميز منحنى توزيع تي (t-distribution) بأنه:","options":["A) Symmetric and bell-shaped with lighter tails than normal","B) Symmetric and bell-shaped with heavier tails than normal","C) Asymmetric with heavier tails than normal","D) Identical to the normal distribution for all sample sizes"],"optionsAr":["A) متماثل وناقوسي بذيول أخف من التوزيع الطبيعي","B) متماثل وجرسي بذيول أثقل من التوزيع الطبيعي (Symmetric with heavier tails)","C) غير متماثل بذيول أثقل","D) متطابق مع التوزيع الطبيعي لجميع أحجام العينات"],"correct":"B","explanation":{"concept":"Shape of Student's t-Distribution","conceptAr":"شكل وخصائص منحنى توزيع تي","steps":["Like the standard normal curve, the $t$-distribution is symmetric, bell-shaped, and centered at $0$.","However, because estimating $\\sigma$ with $s$ introduces extra sampling variability, the $t$-distribution has more spread and heavier (fatter) tails than $Z$."],"stepsAr":["يشبه توزيع تي التوزيع الطبيعي في كونه متماثلاً وجرسياً ومركزه عند الصفر.","ولكن بسبب التباين الإضافي الناتج عن تقدير $\\sigma$ بواسطة $s$، يملك توزيع تي ذيولاً أكثر اتساعاً وثقلاً (Heavier tails) وتشتتاً أكبر."],"whyWrong":"Tails are heavier (more probability in tails), not lighter. And it is symmetric, not asymmetric.","whyWrongAr":"ذيوله أثقل (تحوي مساحة احتمالية أكبر في الأطراف) وهو متماثل تماماً حول الصفر."}},{"id":5,"question":"As the sample size (and degrees of freedom) increases, the t-distribution:","questionAr":"مع زيادة حجم العينة $n$ (وبالتالي درجات الحرية)، فإن توزيع تي:","options":["A) Moves further from the normal distribution","B) Approaches the standard normal distribution","C) Becomes skewed","D) Becomes bimodal"],"optionsAr":["A) يبتعد أكثر عن التوزيع الطبيعي","B) يقترب من التوزيع الطبيعي المعياري (Approaches standard normal)","C) يصبح ملتوياً وغير متماثل","D) يصبح ثنائي المنوال"],"correct":"B","explanation":{"concept":"Asymptotic Behavior of t-Distribution","conceptAr":"التقارب المقارب لتوزيع تي نحو التوزيع الطبيعي","steps":["As $n \\to \\infty$ and $\\text{df} \\to \\infty$, sample standard deviation $s$ converges to true population standard deviation $\\sigma$.","The extra variability vanishes, and the $t$-distribution approaches the standard normal distribution $Z$ ($\\\\lim_{\\text{df}\\to\\infty} t_{\\text{df}} = Z$)."],"stepsAr":["عندما $n \\to \\infty$ و $\\text{df} \\to \\infty$، يقترب انحراف العينة $s$ من انحراف المجتمع $\\sigma$.","يتلاشى التشتت الإضافي ويتطابق توزيع تي تدريجياً مع التوزيع الطبيعي المعياري $Z$."],"whyWrong":"The t-distribution never becomes skewed; it remains symmetric and strictly converges toward Z.","whyWrongAr":"يبقى التوزيع متماثلاً دائماً ويتقارب طردياً مع زيادة العينة نحو التوزيع الطبيعي المعياري Z."}},{"id":6,"question":"The t-random variable is mathematically defined as:","questionAr":"يُعرَّف المتغير العشوائي $T$ رياضياً بالصيغة:","options":["A) $T = Z \\cdot \\sqrt{V/\\nu}$","B) $T = \\frac{Z}{\\sqrt{V/\\nu}}$","C) $T = \\frac{\\sqrt{V/\\nu}}{Z}$","D) $T = Z + \\sqrt{V/\\nu}$"],"optionsAr":["A) $T = Z \\cdot \\sqrt{V/\\nu}$","B) $T = \\frac{Z}{\\sqrt{V/\\nu}}$","C) $T = \\frac{\\sqrt{V/\\nu}}{Z}$","D) $T = Z + \\sqrt{V/\\nu}$"],"correct":"B","explanation":{"concept":"Formal Mathematical Definition of t-Statistic","conceptAr":"التعريف الرياضي لمتغير تي العشوائي","steps":["Let $Z \\sim N(0, 1)$ be a standard normal random variable.","Let $V \\sim \\chi^2_\\nu$ be an independent chi-square random variable with $\\nu$ degrees of freedom.","Then the quotient $T = \\frac{Z}{\\sqrt{V / \\nu}}$ follows a Student's $t$-distribution with $\\nu$ degrees of freedom."],"stepsAr":["إذا كان $Z$ متغيراً طبيعياً معيارياً $N(0, 1)$.","وكان $V$ متغيراً يتبع توزيع كاي تربيع $\\chi^2_\\nu$ بدرجات حرية $\\nu$ مستقلاً عن $Z$.","فإن النسبة $T = \\frac{Z}{\\sqrt{V / \\nu}}$ تتبع توزيع تي ستيودنت بدرجات حرية $\\nu$."],"whyWrong":"It is strictly a quotient of $Z$ divided by the square root of the chi-square variable divided by its degrees of freedom: $T = Z / \\sqrt{V/\\nu}$.","whyWrongAr":"التعريف القياسي هو قسمة المتغير الطبيعي Z على جذر المتغير كاي تربيع مقسوماً على درجات حريته."}},{"id":7,"question":"For the sample 0.74, 0.75, 0.73, 0.75, 0.74, 0.72 ($n = 6$), the sample mean is:","questionAr":"للعينة 0.74، 0.75، 0.73، 0.75، 0.74، 0.72 ($n = 6$)، فإن وسط العينة يساوي:","formula":"\\bar{X} = \\frac{\\sum_{i=1}^{n} X_i}{n}","options":["A) 0.720","B) 0.738","C) 0.750","D) 0.745"],"optionsAr":["A) 0.720","B) 0.738","C) 0.750","D) 0.745"],"correct":"B","explanation":{"concept":"Sample Mean of Decimals","conceptAr":"حساب متوسط القيم العشرية","steps":["Sum of the 6 sample values:","$\\sum X = 0.74 + 0.75 + 0.73 + 0.75 + 0.74 + 0.72 = 4.43$","Sample size $n = 6$","$\\bar{X} = \\frac{4.43}{6} = 0.73833\\dots \\approx 0.738$"],"stepsAr":["مجموع القيم الست:","$\\sum X = 0.74 + 0.75 + 0.73 + 0.75 + 0.74 + 0.72 = 4.43$","حجم العينة $n = 6$","$\\bar{X} = \\frac{4.43}{6} \\approx 0.738$"],"whyWrong":"0.720 is the minimum, 0.750 is the maximum. The true arithmetic mean is 0.738.","whyWrongAr":"0.720 أصغر قيمة و 0.750 أكبر قيمة، والوسط الدقيق هو 0.738."}},{"id":8,"question":"For that sample ($n = 6$), the degrees of freedom used for the critical t-value is:","questionAr":"لتلك العينة بحجم ($n = 6$)، درجات الحرية المستخدمة لقيمة t الحرجة هي:","options":["A) 6","B) 5","C) 4","D) 7"],"optionsAr":["A) 6","B) 5","C) 4","D) 7"],"correct":"B","explanation":{"concept":"Degrees of Freedom Calculation","conceptAr":"حساب درجات الحرية","steps":["Formula: $\\text{df} = n - 1$.","Given sample size $n = 6$:","$\\text{df} = 6 - 1 = 5$."],"stepsAr":["القانون: $\\text{df} = n - 1$.","حجم العينة المعطى $n = 6$:","درجات الحرية: $\\text{df} = 6 - 1 = 5$."],"whyWrong":"Degrees of freedom is always sample size minus 1 for a single sample mean: $6 - 1 = 5$.","whyWrongAr":"درجات الحرية لعينة واحدة هي حجم العينة ناقص 1 دائماً: $6 - 1 = 5$."}},{"id":9,"question":"For a 95% confidence interval with $\\text{df} = 5$, the critical t-value $t_{5, 0.025}$ is approximately:","questionAr":"لفترة ثقة 95% بدرجات حرية $\\text{df} = 5$، فإن قيمة t الحرجة $t_{5, 0.025}$ تساوي تقريباً:","options":["A) 1.96","B) 2.015","C) 2.571","D) 3.365"],"optionsAr":["A) 1.96","B) 2.015","C) 2.571","D) 3.365"],"correct":"C","explanation":{"concept":"Reading Critical t-Values from Student's t-Table","conceptAr":"استخراج قيمة t الحرجة من جدول ستيودنت","steps":["Confidence level: $95\\% \\implies \\alpha = 0.05$.","Two-tailed critical value: $\\alpha/2 = 0.025$ in the upper tail.","Intersection of row $\\text{df} = 5$ and column $0.025$ in the $t$-table yields $t_{5, 0.025} = 2.571$."],"stepsAr":["مستوى الثقة $95\\% \\implies \\alpha = 0.05$ ومساحة الطرف $\\alpha/2 = 0.025$.","بالتقاطع بين صف درجات الحرية $\\text{df} = 5$ وعمود $0.025$:","القيمة الحرجة في جدول t هي $2.571$."],"whyWrong":"1.96 is the Z value for infinite df. For df = 5, the critical value expands to 2.571 due to small sample uncertainty.","whyWrongAr":"1.96 تخص التوزيع الطبيعي المعياري (درجات حرية لانهائية)، بينما عند df = 5 تتسع القيمة الحرجة إلى 2.571."}},{"id":10,"question":"The 95% confidence interval for the mean of the sample (0.74, 0.75, 0.73, 0.75, 0.74, 0.72) is:","questionAr":"فترة الثقة 95% لمتوسط العينة (0.74، 0.75، 0.73، 0.75، 0.74، 0.72) هي:","formula":"\\text{CI} = \\bar{X} \\pm t_{\\alpha/2, n-1} \\left(\\frac{s}{\\sqrt{n}}\\right)","options":["A) (0.720, 0.756)","B) (0.727, 0.750)","C) (0.700, 0.776)","D) (0.738, 0.750)"],"optionsAr":["A) (0.720, 0.756)","B) (0.727, 0.750)","C) (0.700, 0.776)","D) (0.738, 0.750)"],"correct":"B","explanation":{"concept":"Small Sample t-Confidence Interval Calculation","conceptAr":"حساب فترة الثقة لعينة صغيرة باستخدام توزيع t","steps":["Sample mean: $\\bar{X} = 0.7383$.","Sample standard deviation: $s \\approx 0.01169$.","Standard error: $\\frac{s}{\\sqrt{n}} = \\frac{0.01169}{\\sqrt{6}} \\approx 0.00477$.","Margin of error: $E = t_{5, 0.025} \\cdot \\text{SE} = 2.571 \\times 0.00477 \\approx 0.0122$.","Interval: $0.7383 \\pm 0.0122 = (0.7266, 0.7505) \\approx (0.727, 0.750)$."],"stepsAr":["وسط العينة: $\\bar{X} = 0.7383$.","انحراف العينة المعياري: $s \\approx 0.01169$.","الخطأ المعياري: $\\frac{s}{\\sqrt{6}} \\approx 0.00477$.","هامش الخطأ: $E = 2.571 \\times 0.00477 \\approx 0.012$.","فترة الثقة: $0.7383 \\pm 0.012 = (0.727, 0.750)$."],"whyWrong":"Calculating the exact margins with $t = 2.571$ gives the interval bounds $(0.727, 0.750)$.","whyWrongAr":"بحساب الهامش بالتعويض الدقيق لقيمة t نجد أن حدود الفترة هي (0.727، 0.750)."}},{"id":11,"question":"For the difference between two population means (large independent samples), the standard error is:","questionAr":"للفرق بين متوسطي مجتمعين (في حالة العينات الكبيرة المستقلة)، يُحسب الخطأ المعياري بالصيغة:","options":["A) $\\sqrt{\\frac{s_1^2}{n_1} - \\frac{s_2^2}{n_2}}$","B) $\\sqrt{\\frac{s_1^2}{n_1} + \\frac{s_2^2}{n_2}}$","C) $\\frac{s_1 + s_2}{\\sqrt{n}}$","D) $s_p \\sqrt{\\frac{1}{n_1} + \\frac{1}{n_2}}$"],"optionsAr":["A) $\\sqrt{\\frac{s_1^2}{n_1} - \\frac{s_2^2}{n_2}}$","B) $\\sqrt{\\frac{s_1^2}{n_1} + \\frac{s_2^2}{n_2}}$","C) $\\frac{s_1 + s_2}{\\sqrt{n}}$","D) $s_p \\sqrt{\\frac{1}{n_1} + \\frac{1}{n_2}}$"],"correct":"B","explanation":{"concept":"Standard Error of Two Independent Means (Large Samples)","conceptAr":"الخطأ المعياري للفرق بين متوسطين (عينات كبيرة)","steps":["For independent random samples, variances always add: $\\text{Var}(\\bar{X}_1 - \\bar{X}_2) = \\text{Var}(\\bar{X}_1) + \\text{Var}(\\bar{X}_2)$.","$\\text{Var}(\\bar{X}_1 - \\bar{X}_2) = \\frac{\\sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}$.","Taking the square root gives: $\\text{SE} = \\sqrt{\\frac{s_1^2}{n_1} + \\frac{s_2^2}{n_2}}$."],"stepsAr":["للعينات المستقلة، تضاف التباينات دائماً ولا تُطرح: $\\text{Var}(\\bar{X}_1 - \\bar{X}_2) = \\text{Var}(\\bar{X}_1) + \\text{Var}(\\bar{X}_2)$.","وبأخذ الجذر التربيعي نحصل على الخطأ المعياري: $\\sqrt{\\frac{s_1^2}{n_1} + \\frac{s_2^2}{n_2}}$."],"whyWrong":"Variances are never subtracted in standard errors (variability increases when combining random variables).","whyWrongAr":"لا تُطرح التباينات أبداً في الخطأ المعياري، فالتباين الكلي يزداد بالجمع."}},{"id":12,"question":"In Example 2.7 ($\\bar{Y}_1 = 80$, $\\sigma_1 = 5$, $n_1 = 30$; $\\bar{Y}_2 = 75$, $\\sigma_2 = 3$, $n_2 = 30$), the point estimate of $\\mu_1 - \\mu_2$ is:","questionAr":"في المثال 2.7 ($\\bar{Y}_1 = 80$, $\\sigma_1 = 5$, $n_1 = 30$; $\\bar{Y}_2 = 75$, $\\sigma_2 = 3$, $n_2 = 30$)، فإن التقدير بنقطة للفرق $\\mu_1 - \\mu_2$ هو:","formula":"\\hat{\\theta} = \\bar{Y}_1 - \\bar{Y}_2","options":["A) 3","B) 5","C) 7","D) 155"],"optionsAr":["A) 3","B) 5","C) 7","D) 155"],"correct":"B","explanation":{"concept":"Point Estimate for Difference Between Two Means","conceptAr":"التقدير بنقطة للفرق بين متوسطين","steps":["The best point estimator of $\\mu_1 - \\mu_2$ is the difference in sample means:","$\\bar{Y}_1 - \\bar{Y}_2 = 80 - 75 = 5$."],"stepsAr":["أفضل تقدير بنقطة للفرق بين متوسطي مجتمعين $\\mu_1 - \\mu_2$ هو الفرق بين متوسطي عينتيهما:","$\\bar{Y}_1 - \\bar{Y}_2 = 80 - 75 = 5$."],"whyWrong":"Simply subtract the second sample mean from the first: 80 - 75 = 5.","whyWrongAr":"بطرح متوسط العينة الثانية من الأولى: 80 - 75 = 5."}},{"id":13,"question":"In Example 2.7 ($\\sigma_1 = 5, n_1 = 30; \\sigma_2 = 3, n_2 = 30$), the standard error of the difference is approximately:","questionAr":"في المثال 2.7 ($\\sigma_1 = 5, n_1 = 30; \\sigma_2 = 3, n_2 = 30$)، الخطأ المعياري لفرق المتوسطين يساوي تقريباً:","formula":"\\sigma_{\\bar{Y}_1 - \\bar{Y}_2} = \\sqrt{\\frac{\\sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}}","options":["A) 0.53","B) 1.0646","C) 2.00","D) 5.00"],"optionsAr":["A) 0.53","B) 1.0646","C) 2.00","D) 5.00"],"correct":"B","explanation":{"concept":"Calculation of Two-Sample Standard Error","conceptAr":"حساب الخطأ المعياري للعينتين","steps":["$\\sigma_1 = 5 \\implies \\sigma_1^2 = 25$","$\\sigma_2 = 3 \\implies \\sigma_2^2 = 9$","$\\text{SE} = \\sqrt{\\frac{25}{30} + \\frac{9}{30}} = \\sqrt{\\frac{34}{30}} = \\sqrt{1.13333} \\approx 1.06458 \\approx 1.0646$."],"stepsAr":["$\\sigma_1^2 = 25$ و $\\sigma_2^2 = 9$","$\\text{SE} = \\sqrt{\\frac{25}{30} + \\frac{9}{30}} = \\sqrt{\\frac{34}{30}} = \\sqrt{1.1333} \\approx 1.0646$."],"whyWrong":"Squaring the standard deviations and dividing by 30 gives $\\sqrt{34/30} = 1.0646$.","whyWrongAr":"بتربيع الانحرافات وقسمتها على 30 وأخذ الجذر التربيعي نحصل على 1.0646."}},{"id":14,"question":"For a 94% confidence level, $\\alpha/2$ equals:","questionAr":"لمستوى ثقة مقداره 94%، فإن قيمة $\\alpha/2$ تساوي:","options":["A) 0.06","B) 0.03","C) 0.05","D) 0.02"],"optionsAr":["A) 0.06","B) 0.03","C) 0.05","D) 0.02"],"correct":"B","explanation":{"concept":"Significance Level Halving","conceptAr":"تحديد مساحة الطرف لمستوى ثقة 94%","steps":["Confidence level: $94\\% = 0.94$.","Significance level: $\\alpha = 1 - 0.94 = 0.06$.","Split across two symmetrical tails: $\\frac{\\alpha}{2} = \\frac{0.06}{2} = 0.03$."],"stepsAr":["مستوى الثقة $= 0.94$.","$\\alpha = 1 - 0.94 = 0.06$.","تقسيم على طرفين: $\\frac{\\alpha}{2} = \\frac{0.06}{2} = 0.03$."],"whyWrong":"0.06 is total $\\alpha$. Divided by 2 for each tail gives 0.03.","whyWrongAr":"0.06 هو إجمالي ألفا للطرفين، ولكل طرف بمفرده 0.03."}},{"id":15,"question":"The 94% confidence interval for $\\mu_1 - \\mu_2$ in Example 2.7 (Estimate = 5, $\\text{SE} \\approx 1.0646$, $z_{0.03} \\approx 1.88$) is approximately:","questionAr":"فترة الثقة 94% للفرق $\\mu_1 - \\mu_2$ في المثال 2.7 هي تقريباً:","formula":"\\text{CI} = (\\bar{Y}_1 - \\bar{Y}_2) \\pm z_{\\alpha/2} \\cdot \\text{SE}","options":["A) (1.00, 9.00)","B) (3.00, 7.00)","C) (2.00, 8.00)","D) (4.00, 6.00)"],"optionsAr":["A) (1.00, 9.00)","B) (3.00, 7.00)","C) (2.00, 8.00)","D) (4.00, 6.00)"],"correct":"B","explanation":{"concept":"Two-Sample Difference Confidence Interval","conceptAr":"حساب فترة الثقة للفرق بين متوسطين","steps":["Point estimate: $80 - 75 = 5$.","Critical value for $\\alpha/2 = 0.03$: $z_{0.03} = 1.88$.","Standard error: $\\text{SE} = 1.0646$.","Margin of error: $E = 1.88 \\times 1.0646 \\approx 2.00$.","Interval: $5 \\pm 2.00 = (3.00, 7.00)$."],"stepsAr":["التقدير بنقطة: $80 - 75 = 5$.","القيمة الحرجة لـ $\\alpha/2 = 0.03$ هي $z = 1.88$.","الخطأ المعياري: $\\text{SE} = 1.0646$.","هامش الخطأ: $E = 1.88 \\times 1.0646 \\approx 2.00$.","فترة الثقة: $5 \\pm 2.00 = (3.00, 7.00)$."],"whyWrong":"Margin of error is 2.00, so $5 - 2 = 3$ and $5 + 2 = 7$.","whyWrongAr":"هامش الخطأ يساوي 2.00 تماماً، وبالطرح والجمع ينتج (3.00، 7.00)."}},{"id":16,"question":"The pooled standard deviation $s_p$ is used when:","questionAr":"يُستخدم الانحراف المعياري المشترك (Pooled standard deviation $s_p$) عندما:","options":["A) Sample sizes are large and variances are unequal","B) Small samples are used and population variances are assumed equal","C) Populations are not normal","D) The sample size is greater than 30"],"optionsAr":["A) أحجام العينات كبيرة والتباينات غير متساوية","B) العينات صغيرة وتباينات المجتمعين مفترضة التساوي (Equal variances assumed)","C) المجتمعات ليست طبيعية","D) حجم العينة أكبر من 30"],"correct":"B","explanation":{"concept":"Conditions for Pooled Variance Procedure","conceptAr":"شروط استخدام التباين المشترك","steps":["The pooled $t$-procedure assumes:","1. Both populations are normally distributed.","2. Samples are independent and small ($n_1, n_2 < 30$).","3. Population variances are equal: $\\sigma_1^2 = \\sigma_2^2 = \\sigma^2$.","Under these conditions, data from both samples are pooled to provide a single, superior estimate $s_p^2$."],"stepsAr":["شروط استخدام التباين المشترك $s_p$:","1. التوزيعان يتبعان التوزيع الطبيعي.","2. العينات صغيرة ومستقلة.","3. تباين المجتمعين متساوٍ: $\\sigma_1^2 = \\sigma_2^2$.","يتم دمج معلومات العينتين معاً لتقدير التباين المشترك بكفاءة أعلى."],"whyWrong":"Pooling specifically requires the equal variance assumption ($\\sigma_1^2 = \\sigma_2^2$). When variances differ, Welch's unpooled t is used.","whyWrongAr":"الدمج يتطلب حصراً افتراض تساوي تبايني المجتمعين في العينات الصغيرة."}},{"id":17,"question":"The degrees of freedom for the pooled t-procedure is:","questionAr":"درجات الحرية لإجراء اختبار t ذي التباين المشترك للعينتين هي:","options":["A) $n_X + n_Y$","B) $n_X + n_Y - 1$","C) $n_X + n_Y - 2$","D) $n_X - n_Y$"],"optionsAr":["A) $n_X + n_Y$","B) $n_X + n_Y - 1$","C) $n_X + n_Y - 2$","D) $n_X - n_Y$"],"correct":"C","explanation":{"concept":"Degrees of Freedom for Two-Sample Pooled t","conceptAr":"درجات حرية اختبار t المشترك لعينتين","steps":["Sample 1 contributes $n_1 - 1$ degrees of freedom.","Sample 2 contributes $n_2 - 1$ degrees of freedom.","Total degrees of freedom: $\\text{df} = (n_1 - 1) + (n_2 - 1) = n_1 + n_2 - 2$."],"stepsAr":["العينة الأولى تقدم $n_1 - 1$ درجات حرية.","العينة الثانية تقدم $n_2 - 1$ درجات حرية.","إجمالي درجات الحرية: $(n_1 - 1) + (n_2 - 1) = n_1 + n_2 - 2$."],"whyWrong":"Two means are estimated (one from each sample), subtracting 2 degrees of freedom in total.","whyWrongAr":"نظراً لحساب متوسطين مستقلين للعينتين، يتم طرح درجتي حرية: $n_1 + n_2 - 2$."}},{"id":18,"question":"In Example 2.8 (Design I: $n_1 = 11, \\bar{x}_1 = 52, s_1 = 12$; Design II: $n_2 = 6, \\bar{x}_2 = 46, s_2 = 10$), the point estimate of $\\mu_1 - \\mu_2$ is:","questionAr":"في المثال 2.8 (التصميم الأول: $n_1 = 11, \\bar{x}_1 = 52, s_1 = 12$؛ التصميم الثاني: $n_2 = 6, \\bar{x}_2 = 46, s_2 = 10$)، فإن التقدير بنقطة هو:","formula":"\\hat{\\theta} = \\bar{x}_1 - \\bar{x}_2","options":["A) 4 units","B) 6 units","C) 10 units","D) 12 units"],"optionsAr":["A) 4 وحدات","B) 6 وحدات (6 units)","C) 10 وحدات","D) 12 وحدة"],"correct":"B","explanation":{"concept":"Point Estimate of Difference in Means","conceptAr":"التقدير بنقطة للفرق بين المتوسطين","steps":["$\\bar{x}_1 = 52$","$\\bar{x}_2 = 46$","Point Estimate $= \\bar{x}_1 - \\bar{x}_2 = 52 - 46 = 6$ units."],"stepsAr":["$\\bar{x}_1 = 52$","$\\bar{x}_2 = 46$","التقدير بنقطة $= 52 - 46 = 6$ وحدات."],"whyWrong":"52 - 46 equals 6 units.","whyWrongAr":"طرح متوسط التصميم الثاني من الأول يعطي 6 وحدات."}},{"id":19,"question":"In Example 2.8 ($n_1 = 11, s_1 = 12; n_2 = 6, s_2 = 10$), the pooled variance $s_p^2$ is approximately:","questionAr":"في المثال 2.8 ($n_1 = 11, s_1 = 12; n_2 = 6, s_2 = 10$)، التباين المشترك $s_p^2$ يساوي تقريباً:","formula":"s_p^2 = \\frac{(n_1-1)s_1^2 + (n_2-1)s_2^2}{n_1 + n_2 - 2}","options":["A) 100.00","B) 129.33","C) 144.00","D) 122.00"],"optionsAr":["A) 100.00","B) 129.33","C) 144.00","D) 122.00"],"correct":"B","explanation":{"concept":"Pooled Variance Calculation","conceptAr":"حساب التباين المشترك","steps":["Sample 1: $n_1 = 11 \\implies n_1 - 1 = 10$; $s_1 = 12 \\implies s_1^2 = 144$. Numerator 1: $10 \\times 144 = 1440$.","Sample 2: $n_2 = 6 \\implies n_2 - 1 = 5$; $s_2 = 10 \\implies s_2^2 = 100$. Numerator 2: $5 \\times 100 = 500$.","Total degrees of freedom: $11 + 6 - 2 = 15$.","Pooled variance: $s_p^2 = \\frac{1440 + 500}{15} =     let state = {
      language: localStorage.getItem('edugate_mat211_lang') || 'en',
      activeQuizId: null,
      currentQuestionIdx: 0,
      userAnswers: {},
      progress: JSON.parse(localStorage.getItem('edugate_mat211_prog') || '{}'),
      isSubmitted: false
    };

    function saveProgress() {
      localStorage.setItem('edugate_mat211_prog', JSON.stringify(state.progress));
    }

    function toggleLanguage() {
      state.language = state.language === 'en' ? 'ar' : 'en';
      localStorage.setItem('edugate_mat211_lang', state.language);
      document.body.className = state.language === 'ar' ? 'rtl' : 'ltr';
      render();
    }

    function goHome(e) {
      if (e) e.preventDefault();
      state.activeQuizId = null;
      state.currentQuestionIdx = 0;
      state.userAnswers = {};
      state.isSubmitted = false;
      render();
    }

    function openQuiz(quizId) {
      state.activeQuizId = quizId;
      state.currentQuestionIdx = 0;
      state.userAnswers = {};
      state.isSubmitted = false;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectOption(qId, letter) {
      state.userAnswers[qId] = letter;
      render();
    }

    function nextQuestion() {
      const quiz = quizzes.find(q => q.id === state.activeQuizId);
      if (state.currentQuestionIdx < quiz.questions.length - 1) {
        state.currentQuestionIdx++;
        render();
      }
    }

    function prevQuestion() {
      if (state.currentQuestionIdx > 0) {
        state.currentQuestionIdx--;
        render();
      }
    }

    function jumpToQuestion(idx) {
      state.currentQuestionIdx = idx;
      render();
    }

    function submitQuiz() {
      const quiz = quizzes.find(q => q.id === state.activeQuizId);
      let score = 0;
      quiz.questions.forEach(q => {
        if (state.userAnswers[q.id] === q.correct) score++;
      });

      const current = state.progress[quiz.id] || { completed: false, bestScore: 0, attempts: 0 };
      state.progress[quiz.id] = {
        completed: true,
        bestScore: Math.max(current.bestScore, score),
        attempts: (current.attempts || 0) + 1
      };
      saveProgress();

      state.isSubmitted = true;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Confetti burst if >= 80%
      const pct = Math.round((score / quiz.questions.length) * 100);
      if (pct >= 80 && window.confetti) {
        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('appRoot'), {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }
    }

                ${formulaBox}
                ${tableBox}
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; margin-top: 0.75rem; color: #94a3b8;">
                  <div>${isAr ? 'إجابتك:' : 'Your answer:'} <span style="color: ${isCorrect ? '#10b981' : '#f43f5e'}; font-weight: bold;">${userChoice ? userChoice + ') ' + ((opts.find(o => o.startsWith(userChoice + ')')) || '').replace(/^[A-D]\)\s*/, '')) : (isAr ? 'لم تتم الإجابة' : 'Unanswered')}</span></div>
                  ${!isCorrect ? `<div>${isAr ? 'الإجابة الصحيحة:' : 'Correct answer:'} <span style="color: #10b981; font-weight: bold;">${q.correct}) ${((opts.find(o => o.startsWith(q.correct + ')')) || '').replace(/^[A-D]\)\s*/, ''))}</span></div>` : ''}
                </div>
                ${explanationBox}
              </div>
            `;
          }).join('');

          root.innerHTML = `
            <div style="max-width: 800px; margin: 0 auto;">
              <div style="background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 2.5rem; text-align: center; margin-bottom: 2.5rem; box-shadow: 0 16px 32px rgba(0,0,0,0.5);">
                <div class="font-heading" style="font-size: clamp(3rem, 6vw, 5rem); font-weight: 700; color: #fff; line-height: 1;">
                  ${correctCount} / ${total}
                </div>
                <div class="font-mono" style="font-size: 1.5rem; color: #818cf8; margin-top: 0.5rem; font-weight: 600;">
                  (${pct}%)
                </div>
                <div style="font-size: 1.15rem; font-weight: 600; color: ${color}; margin: 1rem 0 1.5rem 0;">
                  ${message}
                </div>
                <div style="display: flex; justify-content: center; gap: 1rem;">
                  <button class="btn-primary" onclick="openQuiz('${quiz.id}')">
                    ${isAr ? 'إعادة الاختبار' : 'Retry Quiz'}
                  </button>
                  <button class="btn-primary" style="background: rgba(255,255,255,0.08); color: #cbd5e1;" onclick="goHome(event)">
                    ${isAr ? 'العودة للاختبارات' : 'Back to Quizzes'}
                  </button>
                </div>
              </div>

              <h3 class="font-heading" style="font-size: 1.5rem; color: #fff; margin-bottom: 1.25rem;">
                ${isAr ? 'مراجعة جميع الأسئلة والحلول' : 'All Questions Review'}
              </h3>
              <div>
                ${reviewItems}
              </div>
            </div>
          `;
        }
      }

      renderMath();
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', () => {
      document.body.className = state.language === 'ar' ? 'rtl' : 'ltr';
      render();
    });
  </script>
</body>
</html>
