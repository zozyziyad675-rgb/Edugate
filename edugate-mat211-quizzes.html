<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUGATE Probability Quizzes (MAT211)</title>
  <meta name="description" content="Interactive practice quizzes for Probability (MAT211) on EDUGATE with bilingual English/Arabic support and KaTeX formulas.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX CSS & JS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Lucide Icons & Canvas Confetti CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg: #030305;
      --surface: #0a0a0f;
      --surface-card: #111118;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Animated background gradient blobs */
    .bg-blob-1 {
      position: fixed;
      top: -15%;
      left: -10%;
      width: 55vw;
      height: 55vw;
      max-width: 700px;
      max-height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
      animation: floatBlob1 22s infinite alternate ease-in-out;
    }

    .bg-blob-2 {
      position: fixed;
      top: 40%;
      right: -15%;
      width: 50vw;
      height: 50vw;
      max-width: 650px;
      max-height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.10) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      animation: floatBlob2 26s infinite alternate ease-in-out;
    }

    @keyframes floatBlob1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(40px, -30px, 0) scale(1.1); }
    }

    @keyframes floatBlob2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-40px, 35px, 0) scale(1.15); }
    }

    /* Navbar */
    .glass-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.85rem 1.5rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #e2e8f0;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-brand:hover {
      color: var(--primary);
    }

    .course-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }

    /* Layout Container */
    .app-main {
      position: relative;
      z-index: 10;
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* Quiz Cards Grid */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 2rem;
    }

    @media (max-width: 900px) {
      .quiz-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .quiz-grid {
        grid-template-columns: 1fr;
      }
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .quiz-card:hover {
      transform: translateY(-6px);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 24px -10px rgba(99, 102, 241, 0.25);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .quiz-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .diff-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      border: 1px solid transparent;
    }

    .diff-Easy { color: #34d399; background: rgba(52, 211, 153, 0.1); border-color: rgba(52, 211, 153, 0.2); }
    .diff-Medium { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); }
    .diff-Hard { color: #f87171; background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.2); }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 0.5rem;
      transition: color 0.2s;
    }

    .quiz-card:hover .card-title {
      color: #c7d2fe;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .card-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .completed-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
    }

    /* Option Cards */
    .option-card {
      background: #111118;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: 0.2s ease;
      user-select: none;
    }

    .option-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.05);
    }

    .option-card.selected {
      border-color: #6366f1;
      border-left: 4px solid #6366f1;
      background: rgba(99, 102, 241, 0.08);
    }

    .option-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: 0.2s ease;
    }

    .option-card.selected .option-badge {
      background: var(--primary);
      color: #fff;
    }

    /* Buttons */
    .btn-primary {
      background: #6366f1;
      color: #ffffff;
      border-radius: 10px;
      padding: 12px 32px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* KaTeX Container */
    .formula-box {
      background: #111118;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
      margin: 1.25rem 0;
      overflow-x: auto;
    }

    /* Explanation Box */
    .explanation-box {
      background: rgba(99, 102, 241, 0.03);
      border-left: 4px solid #6366f1;
      border-radius: 0 14px 14px 0;
      padding: 1.5rem;
      margin-top: 1rem;
      animation: expandIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes expandIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating Translate Button */
    .translate-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .translate-btn:hover {
      transform: scale(1.05);
      background: rgba(99, 102, 241, 0.25);
    }

    /* Progress bar */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    /* Navigation dots */
    .nav-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 2rem;
    }

    .nav-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }

    .nav-dot.answered {
      background: var(--primary);
      border-color: var(--primary);
    }

    .nav-dot.active {
      transform: scale(1.4);
      border-color: #a5b4fc;
      background: #818cf8;
    }

    /* Table styling */
    .data-table-container {
      margin: 1.25rem 0;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #111118;
      overflow: hidden;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    .data-table th {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      color: #a5b4fc;
      font-family: 'JetBrains Mono', monospace;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .data-table td {
      padding: 8px 14px;
      color: #cbd5e1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-family: 'JetBrains Mono', monospace;
    }

    .data-table tr:hover {
      background: rgba(99, 102, 241, 0.04);
    }

    /* RTL Support */
    body.rtl {
      direction: rtl;
      font-family: 'Cairo', 'Inter', sans-serif;
    }

    body.rtl .font-mono,
    body.rtl .katex,
    body.rtl .data-table {
      direction: ltr;
      text-align: left;
    }

    body.rtl .explanation-box {
      border-left: none;
      border-right: 4px solid #6366f1;
      border-radius: 14px 0 0 14px;
    }

    body.rtl .option-card.selected {
      border-left: 1px solid #6366f1;
      border-right: 4px solid #6366f1;
    }
  </style>
</head>
<body>
  <!-- Mesh Blobs -->
  <div class="bg-blob-1"></div>
  <div class="bg-blob-2"></div>

  <!-- Navbar -->
  <header class="glass-nav">
    <div class="nav-container">
      <div id="navLeft">
        <a href="index.html" class="nav-brand">
          <span>← Back to EDUGATE</span>
        </a>
      </div>
      <div id="navCenter" class="font-heading" style="font-weight: 700; font-size: 1.1rem; color: #f1f5f9;">
        Probability Quizzes
      </div>
      <div class="course-badge">
        MAT211
      </div>
    </div>
  </header>

  <!-- Main View Anchor -->
  <main class="app-main" id="appRoot">

  </main>

  <!-- Floating Translate Button -->
  <div class="translate-btn" onclick="toggleLanguage()" title="Toggle English / Arabic">
    <span id="langIcon" style="font-size: 1.3rem;">🌐</span>
  </div>

  <!-- Application Logic & Data -->
  <script>
    const quizzes = [{"id":"lecture-1-frequency-distributions","quizNumber":1,"lectureNumber":1,"title":"Lecture 1: Frequency Distributions","titleAr":"المحاضرة 1: التوزيعات التكرارية","subtitle":"Qualitative and quantitative data, classes, frequency tables, histograms, and cumulative frequencies","subtitleAr":"البيانات النوعية والكمية، الفئات، الجداول التكرارية، المدرجات التكرارية، والتكرار التراكمي","difficulty":"Easy","questionCount":20,"questions":[{"id":1,"question":"Statistics is defined as the science of collecting, organizing, presenting, analyzing, and interpreting data to assist in making more effective:","questionAr":"يُعرَّف علم الإحصاء بأنه علم جمع وتنظيم وعرض وتحليل وتفسير البيانات للمساعدة في اتخاذ:","options":["A) Observations","B) Decisions","C) Measurements","D) Samples"],"optionsAr":["A) ملاحظات أكثر فعالية","B) قرارات أكثر فعالية (Decisions)","C) قياسات أكثر فعالية","D) عينات أكثر فعالية"],"correct":"B","explanation":{"concept":"Core Definition of Statistics","conceptAr":"التعريف الأساسي لعلم الإحصاء","steps":["Statistics involves the systematic process: Collection $\\to$ Organization $\\to$ Presentation $\\to$ Analysis $\\to$ Interpretation.","The ultimate goal of this five-step statistical process is decision-making under uncertainty, allowing researchers and managers to make informed, evidence-based decisions."],"stepsAr":["يشمل الإحصاء خطوات منهجية متسلسلة: الجمع $\\to$ التنظيم $\\to$ العرض $\\to$ التحليل $\\to$ التفسير.","الهدف الأسمى لهذه العملية هو تمكين اتخاذ قرارات دقيقة ومبنية على الأدلة في ظل عدم اليقين."],"whyWrong":"Observations and measurements are merely data collection steps, not the ultimate goal. The objective of statistical analysis is making sound Decisions.","whyWrongAr":"الملاحظات والقياسات هي مجرد أدوات لجمع البيانات وليست الهدف النهائي. الهدف الجوهري للإحصاء هو اتخاذ القرارات (Decisions)."}},{"id":2,"question":"Which branch of statistics uses methods to estimate a property of a population on the basis of a sample?","questionAr":"أي فرع من فروع علم الإحصاء يستخدم أساليب لتقدير خاصية لمجتمع دراسي استناداً إلى عينة؟","options":["A) Descriptive statistics","B) Inferential statistics","C) Qualitative statistics","D) Frequency statistics"],"optionsAr":["A) الإحصاء الوصفي (Descriptive statistics)","B) الإحصاء الاستدلالي (Inferential statistics)","C) الإحصاء النوعي (Qualitative statistics)","D) إحصاء التكرارات (Frequency statistics)"],"correct":"B","explanation":{"concept":"Descriptive vs. Inferential Statistics","conceptAr":"الإحصاء الوصفي مقابل الإحصاء الاستدلالي","steps":["Descriptive statistics organizes, summarizes, and presents data from a known sample without generalizing beyond it.","Inferential statistics takes sample statistics (such as $\\bar{X}$) to make probabilistic generalizations, predictions, and estimations about unknown population parameters (such as $\\mu$)."],"stepsAr":["الإحصاء الوصفي يقتصر على تلخيص وتنظيم وعرض بيانات العينة المتاحة دون تعميم.","الإحصاء الاستدلالي (Inferential statistics) يستخدم المؤشرات الإحصائية للعينة للتوصل إلى استنتاجات وتقديرات حول معالم المجتمع الكلي المجهولة."],"whyWrong":"Descriptive statistics only summarizes sample data. Qualitative statistics refers to variable type, not a branch of statistical methodology.","whyWrongAr":"الإحصاء الوصفي يلخص البيانات فقط دون تعميم، والإحصاء النوعي يشير لنوع المتغير وليس لفرع الاستدلال."}},{"id":3,"question":"The entire set of individuals or objects of interest is called:","questionAr":"تُسمى المجموعة الكاملة من الأفراد أو العناصر محل الاهتمام بـ:","options":["A) A sample","B) A population","C) A variable","D) A frequency"],"optionsAr":["A) عينة (Sample)","B) مجتمع الدراسة (Population)","C) متغير (Variable)","D) تكرار (Frequency)"],"correct":"B","explanation":{"concept":"Population vs. Sample Definition","conceptAr":"تعريف مجتمع الدراسة والعينة","steps":["A Population consists of all items or people of interest in a study ($N$).","Characteristics calculated from a population are called Parameters (e.g., $\\mu, \\sigma$)."],"stepsAr":["مجتمع الدراسة (Population) يمثل المجموعة الشاملة والكلية لجميع العناصر أو الأفراد قيد البحث ($N$).","القيم المحسوبة من مجتمع الدراسة تسمى معالم (Parameters) مثل $\\mu$ و $\\sigma$."],"whyWrong":"A sample is only a subset of the population. A variable is an observable characteristic, and frequency is a count.","whyWrongAr":"العينة هي جزء فقط من المجتمع، والمتغير هو الخاصية المقاسة، والتكرار هو عدد مرات الظهور."}},{"id":4,"question":"A portion or part of the population of interest is called:","questionAr":"يُسمى الجزء أو العينة المأخوذة من مجتمع الدراسة بـ:","options":["A) A sample","B) A population","C) A class","D) A variable"],"optionsAr":["A) عينة (Sample)","B) مجتمع (Population)","C) فئة (Class)","D) متغير (Variable)"],"correct":"A","explanation":{"concept":"Sample Definition","conceptAr":"تعريف العينة","steps":["A sample is a representative subset of size $n$ selected from the entire population $N$.","Numerical measures obtained from a sample are called Statistics (e.g., $\\bar{X}, s$)."],"stepsAr":["العينة (Sample) هي جزء أو قطاع ممثل بحجم $n$ يتم اختياره من مجتمع الدراسة $N$.","المقاييس الرقمية المحسوبة من العينة تسمى إحصاءات (Statistics)."],"whyWrong":"A population is the complete group. A class is a category interval in a grouped table.","whyWrongAr":"المجتمع هو الكل، والفئة (Class) هي فترة تصنيفية في الجدول التكراري."}},{"id":5,"question":"A variable observed and recorded as a non-numeric characteristic or attribute is:","questionAr":"المتغير الذي يُرصد ويُسجل كخاصية أو سمة غير عددية يُسمى متغيراً:","options":["A) Quantitative","B) Discrete","C) Qualitative","D) Continuous"],"optionsAr":["A) كمياً (Quantitative)","B) منفصلاً (Discrete)","C) نوعياً / وصفياً (Qualitative)","D) متصلاً (Continuous)"],"correct":"C","explanation":{"concept":"Qualitative (Categorical) Variables","conceptAr":"المتغيرات النوعية (الوصفية)","steps":["Qualitative (or categorical/attribute) variables represent non-numeric qualities or categories.","Examples: gender, nationality, hair color, blood type, car make."],"stepsAr":["المتغيرات النوعية (Qualitative) تعبر عن سمات أو فئات غير رقمية.","أمثلة: الجنس، لون العينين، فصيلة الدم، العلامة التجارية."],"whyWrong":"Quantitative variables are numerical (either discrete or continuous). Non-numeric attributes are strictly qualitative.","whyWrongAr":"المتغيرات الكمية هي متغيرات رقمية (إما منفصلة أو متصلة)، بينما الصفات غير العددية هي نوعية حتماً."}},{"id":6,"question":"Which of the following is an example of a qualitative variable?","questionAr":"أي مما يلي يُعد مثالاً على متغير نوعي (وصفي)؟","options":["A) Balance in your checking account","B) The life of a car battery","C) Eye color","D) Number of people employed by a company"],"optionsAr":["A) رصيد حسابك المصرفي","B) العمر التشغيلي لبطارية السيارة","C) لون العينين (Eye color)","D) عدد الموظفين في شركة"],"correct":"C","explanation":{"concept":"Qualitative Examples","conceptAr":"أمثلة المتغيرات النوعية","steps":["Bank balance (dollars) = Quantitative Continuous","Battery life (hours) = Quantitative Continuous","Number of employees (count) = Quantitative Discrete","Eye color (blue, brown, green) = Non-numeric category $\\implies$ Qualitative"],"stepsAr":["رصيد الحساب = متغير كمي متصل","عمر البطارية = متغير كمي متصل","عدد الموظفين = متغير كمي منفصل (بالعد)","لون العينين = فئة غير عددية $\\implies$ متغير نوعي (Qualitative)"],"whyWrong":"Options A, B, and D are all numeric measurements or counts. Only eye color is a qualitative attribute.","whyWrongAr":"الخيارات A و B و D جميعها قيم عددية مقاسة أو معدودة، بينما لون العينين هو صفة غير عددية."}},{"id":7,"question":"Discrete variables are typically the result of:","questionAr":"المتغيرات المنفصلة (Discrete variables) هي عادةً ناتجة عن عملية:","options":["A) Measuring","B) Counting","C) Rounding","D) Estimating"],"optionsAr":["A) القياس (Measuring)","B) العد (Counting)","C) التقريب (Rounding)","D) التقدير (Estimating)"],"correct":"B","explanation":{"concept":"Discrete Variables","conceptAr":"المتغيرات الكمية المنفصلة","steps":["Discrete variables can assume only certain distinct, separated values (typically non-negative integers $0, 1, 2, \\dots$).","They always arise from counting distinct items (e.g., number of defective parts, number of cars)."],"stepsAr":["المتغيرات المنفصلة تأخذ قيماً محددة ومنفصلة (عادة أعداد صحيحة $0, 1, 2, \\dots$).","تنتج دائماً عن عملية العد (Counting) لعناصر محددة."],"whyWrong":"Measuring produces continuous variables (e.g. height, weight, time). Discrete variables are obtained by counting.","whyWrongAr":"القياس ينتج متغيرات متصلة، بينما المتغيرات المنفصلة تأتي دائماً عبر العد."}},{"id":8,"question":"Which of the following is an example of a continuous variable?","questionAr":"أي مما يلي يُمثل مثالاً على متغير متصل (Continuous variable)؟","options":["A) The number of bedrooms in a house","B) The number of students in a statistics course","C) Duration of flights from Orlando to San Diego","D) Number of strokes on a golf hole"],"optionsAr":["A) عدد غرف النوم في المنزل","B) عدد الطلاب في مساق الإحصاء","C) مدة الرحلات الجوية من أورلاندو إلى سان دييغو","D) عدد ضربات الجولف في الحفرة"],"correct":"C","explanation":{"concept":"Continuous Variables","conceptAr":"المتغيرات الكمية المتصلة","steps":["Continuous variables can take on any real value within a given continuum or interval (time, length, mass, temperature).","Flight duration can be $4.521$ hours, $4.5213$ hours, etc., depending on the precision of the measuring instrument."],"stepsAr":["المتغيرات المتصلة يمكن أن تأخذ أي قيمة ضمن مدى أو فترة متصلة على خط الأعداد.","زمن أو مدة الرحلة الجوية يقاس بوحدات زمنية مستمرة ويقبل أجزاء عشرية دقيقة بحسب أداة القياس."],"whyWrong":"Bedrooms, students, and golf strokes are counts of indivisible items ($0, 1, 2, \\dots$), making them discrete variables.","whyWrongAr":"عدد الغرف والطلاب والضربات هي أعداد صحيحة تأتي بالعد، وبالتالي فهي متغيرات منفصلة وليست متصلة."}},{"id":9,"question":"A frequency table groups qualitative data into classes that are:","questionAr":"يقوم جدول التوزيع التكراري بتجميع البيانات النوعية في فئات تتصف بأنها:","options":["A) Mutually exclusive and collectively exhaustive","B) Random and overlapping","C) Numeric and continuous","D) Discrete and infinite"],"optionsAr":["A) متنافية وشاملة كلياً (Mutually exclusive and collectively exhaustive)","B) عشوائية ومتداخلة (Random and overlapping)","C) عددية ومتصلة (Numeric and continuous)","D) منفصلة ولانهائية (Discrete and infinite)"],"correct":"A","explanation":{"concept":"Properties of Frequency Classes","conceptAr":"خصائص فئات التوزيع التكراري","steps":["Mutually exclusive: An observation can fall into one and only one class (no overlap).","Collectively exhaustive: Every single observation must belong to at least one class (nothing is omitted)."],"stepsAr":["مانعة بالتبادل / متنافية (Mutually exclusive): كل مشاهدة تقع في فئة واحدة فقط دون أي تداخل.","شاملة كلياً (Collectively exhaustive): تشمل الفئات جميع المشاهدات دون استثناء أي قيمة."],"whyWrong":"Classes can never overlap (that would cause double-counting). They must partition the entire dataset completely.","whyWrongAr":"لا يمكن للفئات أن تتداخل لأن ذلك يسبب ازدواجية في العد، بل يجب أن تقسم البيانات بدقة وبشكل كامل."}},{"id":10,"question":"In the table with Location and Number of Cars (total 180), the relative frequency for Kane (52 cars) is:","questionAr":"في جدول المواقع وعدد السيارات (المجموع الكلي = 180)، ما هو التكرار النسبي لموقع Kane (52 سيارة)؟","formula":"\\text{Relative Frequency} = \\frac{\\text{Class Frequency}}{\\text{Total Observations}} = \\frac{f}{n}","tableData":{"headers":["Location","Cars Sold (f)"],"headersAr":["الموقع","السيارات المباعة (f)"],"rows":[["Kane",52],["Olean",40],["Sheffield",45],["Tidioute",43],["Total",180]],"caption":"Automobile sales distribution by dealership location"},"options":["A) 52","B) 0.289","C) 0.222","D) 0.250"],"optionsAr":["A) 52","B) 0.289","C) 0.222","D) 0.250"],"correct":"B","explanation":{"concept":"Relative Frequency Calculation","conceptAr":"حساب التكرار النسبي","steps":["Formula: $\\text{Relative Frequency} = \\frac{f}{n}$","Given $f_{\\text{Kane}} = 52$ and total $n = 180$","Calculation: $\\frac{52}{180} = 0.28888\\dots \\approx 0.289$"],"stepsAr":["القانون: $\\text{Relative Frequency} = \\frac{f}{n}$","المعطيات: تكرار موقع Kane هو $f = 52$، وإجمالي السيارات $n = 180$","الحساب: $\\frac{52}{180} = 0.28888\\dots \\approx 0.289$"],"whyWrong":"52 is the raw frequency ($f$), not the relative frequency. $40/180 = 0.222$ is the relative frequency for Olean.","whyWrongAr":"52 هو التكرار المطلق الخام وليس النسبي. والقيمة 0.222 تمثل التكرار النسبي لفرع Olean ($40/180$)."}},{"id":11,"question":"A graph that shows qualitative classes on the horizontal axis and class frequencies on the vertical axis, with bar heights proportional to frequencies, is called a:","questionAr":"الرسم البياني الذي يعرض الفئات النوعية على المحور الأفقي وتكرارات الفئات على المحور الرأسي، بحيث يتناسب ارتفاع الأعمدة مع التكرار، يُسمى:","options":["A) Pie chart","B) Histogram","C) Bar chart","D) Frequency polygon"],"optionsAr":["A) مخطط دائري (Pie chart)","B) مدرج تكراري (Histogram)","C) مخطط أعمدة (Bar chart)","D) مضلع تكراري (Frequency polygon)"],"correct":"C","explanation":{"concept":"Bar Chart vs. Histogram","conceptAr":"مخطط الأعمدة مقابل المدرج التكراري","steps":["A Bar chart is used for qualitative/categorical data, featuring separated bars.","A Histogram is used for quantitative continuous data where adjacent bars touch each other along a numerical axis."],"stepsAr":["مخطط الأعمدة (Bar chart) يُستخدم خصيصاً للبيانات النوعية/الوصفية مع وجود مسافات فاصلة بين الأعمدة.","المدرج التكراري (Histogram) يُستخدم للبيانات الكمية المتصلة وتكون أعمدته متلاصقة."],"whyWrong":"A histogram is for quantitative numerical class intervals, not qualitative categories. A pie chart shows circular wedges.","whyWrongAr":"المدرج التكراري مخصص للفترات العددية الكمية، بينما مخطط الأعمدة مخصص للفئات النوعية المنفصلة."}},{"id":12,"question":"A chart that shows the proportion or percentage that each class represents of the total number of frequencies is a:","questionAr":"المخطط الذي يوضح النسبة أو النسبة المئوية التي تمثلها كل فئة من إجمالي التكرارات على شكل قطاعات دائرية هو:","options":["A) Bar chart","B) Pie chart","C) Histogram","D) Stem-and-leaf display"],"optionsAr":["A) مخطط أعمدة (Bar chart)","B) مخطط دائري (Pie chart)","C) مدرج تكراري (Histogram)","D) مخطط الساق والورقة (Stem-and-leaf display)"],"correct":"B","explanation":{"concept":"Pie Chart Definition","conceptAr":"تعريف المخطط الدائري (Pie Chart)","steps":["A pie chart displays a circle divided into slices/sectors.","Each slice's central angle is proportional to the relative frequency: $\\text{Angle} = \\text{Relative Frequency} \\times 360^\\circ$."],"stepsAr":["يقسم المخطط الدائري الدائرة إلى قطاعات تتناسب زواياها مع التكرار النسبي.","زاوية القطاع = $\\text{Relative Frequency} \\times 360^\\circ$."],"whyWrong":"Bar charts display frequencies via heights. A pie chart represents proportional shares of a whole ($100\\%$).","whyWrongAr":"مخطط الأعمدة يمثل القيم بالارتفاع، بينما المخطط الدائري يعبر عن النسب المئوية لأجزاء من الكل."}},{"id":13,"question":"When constructing a frequency distribution, which of the following is NOT one of the listed steps?","questionAr":"عند بناء جدول توزيع تكراري، أي مما يلي لا يُعد خطوة من الخطوات الأساسية المتبعة؟","options":["A) Decide on the number of classes","B) Determine the class interval","C) Set the individual class limits","D) Calculate the median"],"optionsAr":["A) تحديد عدد الفئات","B) تحديد طول الفئة (Class interval)","C) وضع حدود الفئات الفردية","D) حساب الوسيط (Calculate the median)"],"correct":"D","explanation":{"concept":"Steps for Constructing a Frequency Distribution","conceptAr":"خطوات بناء التوزيع التكراري","steps":["Step 1: Decide on number of classes $k$ (using $2^k > n$ rule).","Step 2: Determine class interval width $i \\ge \\frac{\\text{Max} - \\text{Min}}{k}$.","Step 3: Set individual class limits.","Step 4: Tally raw data and count class frequencies.","Calculating the median is a measure of location computed AFTER the distribution is built, not a construction step."],"stepsAr":["الخطوة 1: تحديد عدد الفئات $k$ (قاعدة $2^k > n$).","الخطوة 2: حساب طول الفئة $i \\ge \\frac{\\text{Max} - \\text{Min}}{k}$.","الخطوة 3: تحديد الحدود الدنيا والعليا للفئات.","الخطوة 4: تفريغ البيانات وحساب التكرارات.","حساب الوسيط هو مقياس نزعة مركزية يتم حسابه لاحقاً وليس خطوة من خطوات إنشاء الجدول."],"whyWrong":"Deciding $k$, finding interval width $i$, and establishing limits are the canonical steps. Median is computed subsequently.","whyWrongAr":"تحديد الفئات وطولها وحدودها هي الخطوات البنائية الثلاث، بينما الوسيط يُحسب لاحقاً."}},{"id":14,"question":"For the Wachesaw Manufacturing data (16 days of units: max = 31, min = 25), the range is calculated as:","questionAr":"لبيانات شركة Wachesaw (16 يوماً من الإنتاج، حيث القيمة العظمى = 31 والدنيا = 25)، يُحسب المدى بـ:","formula":"\\text{Range} = X_{\\max} - X_{\\min}","options":["A) 31 − 25 = 6","B) 28 − 25 = 3","C) 31 − 27 = 4","D) 30 − 26 = 4"],"optionsAr":["A) 31 − 25 = 6","B) 28 − 25 = 3","C) 31 − 27 = 4","D) 30 − 26 = 4"],"correct":"A","explanation":{"concept":"Range of a Dataset","conceptAr":"حساب مدى البيانات (Range)","steps":["Definition: $\\text{Range} = L - S = \\text{Highest Value} - \\text{Lowest Value}$","From the dataset: Highest observation = $31$, Lowest observation = $25$","Calculation: $31 - 25 = 6$"],"stepsAr":["القانون: $\\text{Range} = \\text{أعلى قيمة} - \\text{أدنى قيمة}$","من بيانات المسألة: أعلى قيمة = $31$ وأدنى قيمة = $25$","الحساب: $31 - 25 = 6$"],"whyWrong":"The range must span from the absolute maximum (31) to the absolute minimum (25), which yields 6.","whyWrongAr":"المدى هو الفارق بين أعلى قيمة (31) وأقل قيمة (25) حصراً، والناتج هو 6."}},{"id":15,"question":"In the Wachesaw example, with 6 classes and a range of 6, the class width is:","questionAr":"في مثال Wachesaw، مع 6 فئات ومدى قدره 6، يكون طول الفئة (Class width) هو:","formula":"i \\ge \\frac{\\text{Range}}{k}","options":["A) 6","B) 1","C) 2","D) 3"],"optionsAr":["A) 6","B) 1","C) 2","D) 3"],"correct":"B","explanation":{"concept":"Class Width Formula","conceptAr":"قانون طول الفئة (Class Interval)","steps":["Formula: $i \\ge \\frac{\\text{Range}}{k}$ where $k$ is number of classes.","Given $\\text{Range} = 6$ and $k = 6$ classes:","$i = \\frac{6}{6} = 1$"],"stepsAr":["القانون: $i \\ge \\frac{\\text{Range}}{k}$ حيث $k$ هو عدد الفئات.","بالتعويض بالمدى $6$ وعدد الفئات $6$:","$i = \\frac{6}{6} = 1$"],"whyWrong":"Dividing range 6 by 6 classes gives 1. A width of 2 or 3 would exceed the required span.","whyWrongAr":"قسمة المدى 6 على 6 فئات تعطي 1 تماماً."}},{"id":16,"question":"In the Wachesaw solution table, the class \"25 − 26\" has a frequency of:","questionAr":"في جدول حل مثال Wachesaw، الفئة \"25 − 26\" تملك تكراراً مقداره:","tableData":{"headers":["Class (Units)","Tally / Frequency (f)","Relative Frequency","Cumulative Frequency"],"headersAr":["الفئة (الوحدات)","التكرار (f)","التكرار النسبي","التكرار التراكمي"],"rows":[["25 - 26",4,"0.250",4],["27 - 28",4,"0.250",8],["29 - 30",4,"0.250",12],["31 - 32",4,"0.250",16]],"caption":"Wachesaw Manufacturing daily production frequency distribution"},"options":["A) 2","B) 4","C) 6","D) 1"],"optionsAr":["A) 2","B) 4","C) 6","D) 1"],"correct":"B","explanation":{"concept":"Class Frequency Tally","conceptAr":"حساب تكرار الفئة من البيانات","steps":["The raw observations falling into the interval $[25, 26]$ are: 25, 25, 26, 26.","Counting these observations gives a frequency of $f = 4$."],"stepsAr":["القيم التي تقع ضمن الفئة $[25, 26]$ في العينة هي: 25, 25, 26, 26.","بجمعها نحصل على تكرار $f = 4$."],"whyWrong":"The exact tally for values 25 and 26 in the 16-day manufacturing dataset is 4.","whyWrongAr":"عدد الأيام التي تم فيها إنتاج 25 أو 26 وحدة هو 4 أيام بالضبط."}},{"id":17,"question":"In the Wachesaw solution table, the relative frequency for the class \"27 − 28\" (with $f = 4, n = 16$) is:","questionAr":"في جدول Wachesaw، التكرار النسبي للفئة \"27 − 28\" (مع $f = 4, n = 16$) يساوي:","formula":"\\text{Relative Frequency} = \\frac{f}{n}","options":["A) 0.25","B) 0.125","C) 0.0625","D) 0.50"],"optionsAr":["A) 0.25","B) 0.125","C) 0.0625","D) 0.50"],"correct":"A","explanation":{"concept":"Relative Frequency Calculation","conceptAr":"حساب التكرار النسبي للفئة","steps":["Class frequency for $27-28$ is $f = 4$.","Total number of days observed is $n = 16$.","Relative frequency $= \\frac{4}{16} = 0.25$ (or $25\\%$)."],"stepsAr":["تكرار الفئة $27-28$ هو $f = 4$.","إجمالي الأيام في العينة هو $n = 16$.","التكرار النسبي $= \\frac{4}{16} = 0.25$ (أي $25\\%$)."],"whyWrong":"$4/16$ simplifies to $1/4 = 0.25$. 0.125 corresponds to $2/16$.","whyWrongAr":"قسمة $4 / 16$ تساوي $0.25$ تماماً."}},{"id":18,"question":"In the Wachesaw solution table, the cumulative frequency for the class \"27 − 28\" is:","questionAr":"في جدول Wachesaw، التكرار التراكمي للفئة \"27 − 28\" يساوي:","options":["A) 4","B) 8","C) 12","D) 14"],"optionsAr":["A) 4","B) 8","C) 12","D) 14"],"correct":"B","explanation":{"concept":"Cumulative Frequency","conceptAr":"التكرار التراكمي (Cumulative Frequency)","steps":["Cumulative frequency represents the running total of frequencies through the current class.","Class 1 ($25-26$): frequency $= 4$, cumulative frequency $= 4$.","Class 2 ($27-28$): frequency $= 4$, cumulative frequency $= 4 + 4 = 8$."],"stepsAr":["التكرار التراكمي هو مجموع التكرارات من بداية الجدول حتى الفئة الحالية.","الفئة الأولى ($25-26$): التكرار = $4$، التراكمي = $4$.","الفئة الثانية ($27-28$): التكرار = $4$، التراكمي = $4 + 4 = 8$."],"whyWrong":"4 is only the first class; 12 is the cumulative frequency through the third class (29-30). Through class 27-28, it is 8.","whyWrongAr":"4 هو تكرار الفئة الأولى فقط، و 12 هو تراكم الفئة الثالثة، أما الفئة الثانية فمجموعها التراكمي هو 8."}},{"id":19,"question":"Which of the following is an example of a discrete variable?","questionAr":"أي مما يلي يُعد مثالاً على متغير كمي منفصل (Discrete variable)؟","options":["A) Weight of a student","B) Yearly rainfall in Tampa, FL","C) TV sets owned","D) Amount of income tax paid"],"optionsAr":["A) وزن الطالب","B) كمية الأمطار السنوية في تامبا","C) عدد أجهزة التلفاز المملوكة (TV sets owned)","D) مبلغ ضريبة الدخل المدفوع"],"correct":"C","explanation":{"concept":"Discrete vs. Continuous Data","conceptAr":"التمييز بين البيانات المنفصلة والمتصلة","steps":["Weight, rainfall, and monetary amounts are continuous measurements that can assume fractions and continuum values.","TV sets owned is a count of physical units that can only take integer values: $0, 1, 2, 3, \\dots$, making it strictly discrete."],"stepsAr":["الوزن وهطول الأمطار والمبالغ المالية هي كميات مقاسة مستمرة تقبل قيماً كسرية.","عدد أجهزة التلفاز يمثل عداً لوحدات صحيحة غير قابلة للتجزئة ($0, 1, 2, \\dots$) فهو منفصل حصراً."],"whyWrong":"Weight and rainfall require continuous physical scales. TV sets must be counted in whole numbers.","whyWrongAr":"الوزن وكمية المطر مقاييس مستمرة، بينما عدد الأجهزة يُعد بأعداد صحيحة فقط."}},{"id":20,"question":"In the profit frequency distribution table (total 180 vehicles), which class has the highest frequency?","questionAr":"في جدول التوزيع التكراري لأرباح مبيعات المركبات (المجموع 180)، ما هي الفئة التي تمتلك أعلى تكرار؟","tableData":{"headers":["Profit Range ($)","Number of Vehicles Sold (f)"],"headersAr":["فئة الربح ($)","عدد المركبات المباعة (f)"],"rows":[["$1,000 up to $1,400",23],["$1,400 up to $1,800",38],["$1,800 up to $2,200",45],["$2,200 up to $2,600",32],["$2,600 up to $3,000",19],["Total",180]],"caption":"Vehicle profit frequency distribution"},"options":["A) $1,400 up to $1,800 (38)","B) $1,800 up to $2,200 (45)","C) $2,200 up to $2,600 (32)","D) $1,000 up to $1,400 (23)"],"optionsAr":["A) $1,400 up to $1,800 (38)","B) $1,800 up to $2,200 (45)","C) $2,200 up to $2,600 (32)","D) $1,000 up to $1,400 (23)"],"correct":"B","explanation":{"concept":"Modal Class Identification","conceptAr":"تحديد الفئة المنوالية (ذات التكرار الأعلى)","steps":["Scan the frequency column $f$ across all class intervals:","Classes: $23, 38, 45, 32, 19$.","Maximum frequency is $45$, which belongs to the class interval \\$1,800 up to \\$2,200 (the modal class)."],"stepsAr":["بمقارنة قيم التكرارات في العمود: 23، 38، 45، 32، 19.","نجد أن أعلى تكرار هو $45$ ويقابل الفئة من $1,800$ إلى $2,200$ دولار (وهي الفئة المنوالية)."],"whyWrong":"45 is the maximum frequency value, occurring in class \\$1,800 up to \\$2,200.","whyWrongAr":"أكبر تكرار في الجدول هو 45 للفئة B."}}]},{"id":"lecture-2-measures-central-tendency-dispersion","quizNumber":2,"lectureNumber":2,"title":"Lecture 2: Central Tendency & Dispersion","titleAr":"المحاضرة 2: مقاييس النزعة المركزية والتشتت","subtitle":"Mean, median, mode, percentiles, skewness, variance, standard deviation, and grouped data","subtitleAr":"المتوسط، الوسيط، المنوال، المئينات، الالتواء، التباين، الانحراف المعياري، والبيانات المبوبة","difficulty":"Medium","questionCount":20,"questions":[{"id":1,"question":"The arithmetic mean is defined as:","questionAr":"يُعرَّف الوسط الحسابي (المتوسط) بأنه:","options":["A) The middle value of an ordered dataset","B) The sum of all data values divided by the total number of observations","C) The most frequently occurring value","D) The difference between the largest and smallest values"],"optionsAr":["A) القيمة المتوسطة لمجموعة بيانات مرتبة","B) حاصل جمع كافة قيم البيانات مقسوماً على إجمالي عدد المشاهدات","C) القيمة الأكثر تكراراً وشيوعاً في البيانات","D) الفرق بين أكبر قيمة وأصغر قيمة"],"correct":"B","explanation":{"concept":"Arithmetic Mean Formula","conceptAr":"قانون الوسط الحسابي","steps":["The sample mean $\\bar{X}$ is the sum of observations divided by sample size $n$:","$\\bar{X} = \\frac{\\sum X}{n}$","It acts as the gravitational center of the distribution where $\\sum (X_i - \\bar{X}) = 0$."],"stepsAr":["الوسط الحسابي لعينة $\\bar{X}$ هو مجموع القيم مقسوماً على حجم العينة $n$:","$\\bar{X} = \\frac{\\sum X}{n}$","ويعتبر مركز الثقل للبيانات بحيث يكون مجموع انحرافات القيم عنه مساوياً للصفر $\\sum (X_i - \\bar{X}) = 0$."],"whyWrong":"A is the Median, C is the Mode, and D is the Range.","whyWrongAr":"الخيار A يمثل الوسيط، و C يمثل المنوال، و D يمثل المدى."}},{"id":2,"question":"For a sample of five heights (65.51, 72.30, 68.31, 67.05, 70.68 inches), the sample mean is:","questionAr":"لعينة مكونة من خمسة أطوال (65.51، 72.30، 68.31، 67.05، 70.68 بوصة)، فإن الوسط الحسابي للعينة هو:","formula":"\\bar{X} = \\frac{\\sum_{i=1}^{n} X_i}{n}","options":["A) 67.05 in.","B) 68.31 in.","C) 68.77 in.","D) 70.68 in."],"optionsAr":["A) 67.05 in.","B) 68.31 in.","C) 68.77 in.","D) 70.68 in."],"correct":"C","explanation":{"concept":"Sample Mean Calculation","conceptAr":"حساب الوسط الحسابي للعينة","steps":["Sum of observations: $\\sum X = 65.51 + 72.30 + 68.31 + 67.05 + 70.68 = 343.85$","Number of observations: $n = 5$","$\\bar{X} = \\frac{343.85}{5} = 68.77$ inches"],"stepsAr":["مجموع المشاهدات: $\\sum X = 65.51 + 72.30 + 68.31 + 67.05 + 70.68 = 343.85$","عدد المشاهدات: $n = 5$","$\\bar{X} = \\frac{343.85}{5} = 68.77$ بوصة"],"whyWrong":"68.31 is the sample median, not the mean. The arithmetic mean is exactly 68.77 in.","whyWrongAr":"القيمة 68.31 هي الوسيط، بينما الوسط الحسابي الدقيق هو 68.77 بوصة."}},{"id":3,"question":"When $n$ is odd, the median position is determined by:","questionAr":"عندما يكون حجم العينة $n$ عدداً فردياً، فإن رتبة (موقع) الوسيط تُحدد بالقانون:","options":["A) $\\frac{n}{2}$","B) $\\frac{n+1}{2}$","C) $\\frac{n-1}{2}$","D) $\\frac{3(n+1)}{4}$"],"optionsAr":["A) $\\frac{n}{2}$","B) $\\frac{n+1}{2}$","C) $\\frac{n-1}{2}$","D) $\\frac{3(n+1)}{4}$"],"correct":"B","explanation":{"concept":"Median Location Rule for Odd Sample Sizes","conceptAr":"تحديد موقع الوسيط لحجم عينة فردي","steps":["After arranging the dataset in ascending order, the exact midpoint for odd $n$ is located at:","$\\text{Rank} = \\frac{n + 1}{2}$","For example, with $n = 5$, the position is $\\frac{5+1}{2} = 3$rd observation."],"stepsAr":["بعد ترتيب البيانات تصاعدياً، تقع المشاهدة الوسطى تماماً عند الرتبة:","$\\text{الموقع} = \\frac{n + 1}{2}$","مثال: إذا كانت $n = 5$، فإن الموقع هو $\\frac{5+1}{2} = 3$ أي القيمة الثالثة."],"whyWrong":"$n/2$ is used for continuous formulas or even samples where two middle values are averaged.","whyWrongAr":"$n/2$ تُستخدم في البيانات الزوجية لأخذ متوسط القيمتين المركزيتين."}},{"id":4,"question":"For the five heights (65.51, 72.30, 68.31, 67.05, 70.68), the sample median is:","questionAr":"للأطوال الخمسة (65.51، 72.30، 68.31، 67.05، 70.68)، فإن وسيط العينة يساوي:","options":["A) 65.51","B) 67.05","C) 68.31","D) 70.68"],"optionsAr":["A) 65.51","B) 67.05","C) 68.31","D) 70.68"],"correct":"C","explanation":{"concept":"Finding the Median in Raw Data","conceptAr":"استخراج الوسيط من البيانات الخام","steps":["Step 1: Arrange data in ascending order: 65.51, 67.05, 68.31, 70.68, 72.30.","Step 2: Position of median with $n = 5$: $\\frac{5+1}{2} = 3$rd position.","Step 3: The 3rd value in the ordered sequence is $68.31$."],"stepsAr":["الخطوة 1: ترتيب البيانات تصاعدياً: 65.51، 67.05، 68.31، 70.68، 72.30.","الخطوة 2: رتبة الوسيط: $\\frac{5+1}{2} = 3$.","الخطوة 3: القيمة الثالثة في الترتيب هي $68.31$."],"whyWrong":"67.05 is the 2nd value, and 68.77 is the mean. The ordered 3rd element is 68.31.","whyWrongAr":"القيمة 67.05 هي الثانية، و 68.77 هو المتوسط. القيمة الوسيطة الواقعة في المنتصف هي 68.31."}},{"id":5,"question":"Quartiles divide an ordered dataset into:","questionAr":"تقسم الربيعات (Quartiles) مجموعة البيانات المرتبة إلى:","options":["A) Two equal parts","B) Four equal parts","C) Ten equal parts","D) One hundred equal parts"],"optionsAr":["A) جزأين متساويين","B) أربعة أجزاء متساوية (Four equal parts)","C) عشرة أجزاء متساوية","D) مائة جزء متساوٍ"],"correct":"B","explanation":{"concept":"Quartiles Definition","conceptAr":"تعريف الربيعات","steps":["Quartiles ($Q_1, Q_2, Q_3$) partition an ordered dataset into 4 equal segments of $25\\%$ each.","$Q_1$ = 25th percentile, $Q_2$ = 50th percentile (Median), $Q_3$ = 75th percentile."],"stepsAr":["الربيعات ($Q_1, Q_2, Q_3$) تجزئ البيانات المرتبة إلى أربعة أجزاء متساوية يمثل كل منها $25\\%$.","$Q_1$ هو الربيع الأدنى ($25\\%$)، $Q_2$ هو الوسيط ($50\\%$)، و $Q_3$ هو الربيع الأعلى ($75\\%$)."],"whyWrong":"Deciles divide into 10 parts, and percentiles divide into 100 parts. Quartiles divide into 4 parts.","whyWrongAr":"العشيرات تقسم لـ 10 أجزاء والمئينات لـ 100 جزء، بينما الربيعات تقسم لـ 4 أجزاء."}},{"id":6,"question":"The second quartile ($Q_2$) is identical to:","questionAr":"الربيع الثاني ($Q_2$) يطابق تماماً:","options":["A) The mode","B) The median","C) The range","D) The standard deviation"],"optionsAr":["A) المنوال","B) الوسيط (The median)","C) المدى","D) الانحراف المعياري"],"correct":"B","explanation":{"concept":"Equivalence of Q2 and Median","conceptAr":"تطابق الربيع الثاني مع الوسيط","steps":["By definition, $50\\%$ of observations lie below $Q_2$ and $50\\%$ lie above.","This is precisely the definition of the Median."],"stepsAr":["بحسب التعريف، يقع $50\\%$ من المشاهدات تحت $Q_2$ و $50\\%$ فوقه.","وهذا هو التعريف الدقيق للوسيط (Median)."],"whyWrong":"Mode is the most frequent value; Range is spread; only the Median marks the 50th percentile.","whyWrongAr":"المنوال هو القيمة الأكثر تكراراً، والمدى هو مقياس تشتت، بينما الوسيط هو المئيل الخمسون."}},{"id":7,"question":"The position of the k-th percentile ($P_k$) is approximately:","questionAr":"تُحدد رتبة (موقع) المئين رقم k بـ ($P_k$) تقريباً بالقانون:","options":["A) $\\frac{k(n+1)}{4}$","B) $\\frac{k(n+1)}{10}$","C) $\\frac{k(n+1)}{100}$","D) $\\frac{k(n+1)}{2}$"],"optionsAr":["A) $\\frac{k(n+1)}{4}$","B) $\\frac{k(n+1)}{10}$","C) $\\frac{k(n+1)}{100}$","D) $\\frac{k(n+1)}{2}$"],"correct":"C","explanation":{"concept":"Percentile Location Formula","conceptAr":"صيغة موقع المئين","steps":["Since percentiles divide data into 100 equal parts, the location of the $k$-th percentile is:","$L_k = \\frac{k(n + 1)}{100}$"],"stepsAr":["نظراً لأن المئينات تقسم التوزيع إلى 100 جزء متساوٍ، فإن موقع المئين رقم $k$ هو:","$L_k = \\frac{k(n + 1)}{100}$"],"whyWrong":"Dividing by 4 gives quartiles, dividing by 10 gives deciles, and dividing by 100 gives percentiles.","whyWrongAr":"القسمة على 4 للربيعات، وعلى 10 للعشيرات، وعلى 100 للمئينات."}},{"id":8,"question":"The fifth decile ($D_5$) is identical to:","questionAr":"العشير الخامس ($D_5$) يطابق تماماً:","options":["A) $Q_1$","B) $Q_3$","C) The median","D) $P_1$"],"optionsAr":["A) $Q_1$","B) $Q_3$","C) الوسيط (The median)","D) $P_1$"],"correct":"C","explanation":{"concept":"Equivalence of D5, Q2, and Median","conceptAr":"تطابق العشير الخامس مع الوسيط","steps":["$D_5$ corresponds to $\\frac{5}{10} = 50\\%$ of the data.","$50\\%$ of the ordered data corresponds to the Median ($Q_2$ and $P_{50}$)."],"stepsAr":["العشير الخامس يمثل $\\frac{5}{10} = 50\\%$ من حجم البيانات.","وهذا يعادل تماماً الوسيط والربيع الثاني والمئين الخمسين."],"whyWrong":"$Q_1$ is the 25th percentile, $Q_3$ is the 75th percentile. $D_5$ is the 50th percentile (Median).","whyWrongAr":"$Q_1$ هو ربيع 25% و $Q_3$ هو 75%، بينما $D_5$ هو 50% أي الوسيط."}},{"id":9,"question":"For the dataset 26, 25, 25, 34, the mode is:","questionAr":"لمجموعة البيانات 26، 25، 25، 34، المنوال هو:","options":["A) 25","B) 26","C) 34","D) No mode"],"optionsAr":["A) 25","B) 26","C) 34","D) لا يوجد منوال"],"correct":"A","explanation":{"concept":"Mode of Raw Data","conceptAr":"إيجاد المنوال للبيانات الخام","steps":["Count occurrences of each value in the dataset:","25 occurs 2 times.","26 occurs 1 time.","34 occurs 1 time.","The value with highest frequency is $25$."],"stepsAr":["حصر تكرار كل رقم في العينة:","الرقم 25 تكرر مرتين.","الرقم 26 تكرر مرة واحدة.","الرقم 34 تكرر مرة واحدة.","القيمة الأكثر تكراراً هي $25$."],"whyWrong":"25 appears twice, while 26 and 34 appear only once. Hence 25 is the unimodal value.","whyWrongAr":"العدد 25 تكرر مرتين بينما البقية مرة واحدة، فالمنوال هو 25."}},{"id":10,"question":"For the dataset 3, 7, 12, 6, 19, the mode is:","questionAr":"لمجموعة البيانات 3، 7، 12، 6، 19، المنوال هو:","options":["A) 3","B) 7","C) 19","D) No mode"],"optionsAr":["A) 3","B) 7","C) 19","D) لا يوجد منوال (No mode)"],"correct":"D","explanation":{"concept":"Absence of Mode","conceptAr":"انعدام المنوال في البيانات","steps":["In the dataset {3, 7, 12, 6, 19}, each distinct observation appears exactly once ($f = 1$).","When no value occurs more frequently than any other, the dataset has No Mode."],"stepsAr":["في المجموعة {3، 7، 12، 6، 19}، يظهر كل رقم مرة واحدة فقط ($f = 1$).","عندما تتساوى جميع القيم في التكرار ولا تتكرر أي قيمة أكثر من غيرها، فإنه لا يوجد منوال."],"whyWrong":"Choosing 3 or 19 is arbitrary. If no value has a frequency greater than 1, there is no mode.","whyWrongAr":"لا يجوز اختيار أصغر أو أكبر قيمة، فعند تساوي التكرار لجميع القيم لا يوجد منوال."}},{"id":11,"question":"For the dataset 3, 3, 12, 6, 8, 8, the dataset is:","questionAr":"لمجموعة البيانات 3، 3، 12، 6، 8، 8، يتصف التوزيع بأنه:","options":["A) Unimodal","B) Bimodal (3 and 8)","C) Multimodal","D) No mode"],"optionsAr":["A) أحادي المنوال (Unimodal)","B) ثنائي المنوال (Bimodal - 3 و 8)","C) متعدد المنوال (Multimodal)","D) عديم المنوال"],"correct":"B","explanation":{"concept":"Bimodal Distribution","conceptAr":"التوزيع ثنائي المنوال (Bimodal)","steps":["Frequencies: value 3 occurs 2 times; value 8 occurs 2 times; 6 and 12 occur 1 time each.","Since two distinct values share the identical maximum frequency of 2, the dataset is Bimodal with modes 3 and 8."],"stepsAr":["التكرارات: الرقم 3 تكرر مرتين، والرقم 8 تكرر مرتين، بينما 6 و 12 تكررا مرة واحدة.","بما أن هناك قيمتين تشتركان في أعلى تكرار، فإن التوزيع ثنائي المنوال (Bimodal) وقيمتاه 3 و 8."],"whyWrong":"It is not unimodal because both 3 and 8 occur twice. It is specifically bimodal.","whyWrongAr":"ليس أحادياً لأن كلاً من 3 و 8 تكررا مرتين بأعلى تكرار، فهو ثنائي المنوال."}},{"id":12,"question":"In a symmetric distribution, what is the relationship between Mean, Median, and Mode?","questionAr":"في التوزيع المتماثل (Symmetric distribution)، ما هي العلاقة بين المتوسط والوسيط والمنوال؟","options":["A) Mean > Median > Mode","B) Mean < Median < Mode","C) Mode = Mean = Median","D) Mode > Mean > Median"],"optionsAr":["A) المتوسط > الوسيط > المنوال","B) المتوسط < الوسيط < المنوال","C) المنوال = المتوسط = الوسيط (Mode = Mean = Median)","D) المنوال > المتوسط > الوسيط"],"correct":"C","explanation":{"concept":"Symmetry and Central Tendency","conceptAr":"التماثل ومقاييس النزعة المركزية","steps":["A symmetric (bell-shaped) distribution has zero skewness ($sk = 0$).","The peak of the distribution occurs exactly at the center, meaning the Mode, Median, and Mean all coincide at the same point: $\\text{Mean} = \\text{Median} = \\text{Mode}$."],"stepsAr":["في التوزيع المتماثل يكون معامل الالتواء صفراً.","تنطبق قمة المنحنى تماماً في المنتصف، مما يعني تطابق المتوسط والوسيط والمنوال في نفس النقطة المركزية."],"whyWrong":"Inequalities indicate skewness. Strict equality occurs solely in perfectly symmetric distributions.","whyWrongAr":"حالات عدم التساوي تشير إلى وجود التواء، بينما التساوي التام يتحقق فقط في التوزيع المتماثل."}},{"id":13,"question":"In a negatively skewed (skewed left) distribution:","questionAr":"في التوزيع الملتوي إلى اليسار أو التواء سالب (Negatively skewed):","options":["A) Mean > Median > Mode","B) Mean < Median < Mode","C) Mode = Mean = Median","D) Mode < Median < Mean"],"optionsAr":["A) المتوسط > الوسيط > المنوال","B) المتوسط < الوسيط < المنوال (Mean < Median < Mode)","C) المنوال = المتوسط = الوسيط","D) المنوال < الوسيط < المتوسط"],"correct":"B","explanation":{"concept":"Left-Skewed (Negative Skew) Relationship","conceptAr":"علاقة المقاييس في التوزيع الملتوي سالباً (يساراً)","steps":["In a negatively skewed distribution, extreme small values in the long left tail pull the sensitive Mean downward.","The Median resists outliers better, and the Mode stays at the high peak on the right.","Thus: $\\text{Mean} < \\text{Median} < \\text{Mode}$."],"stepsAr":["في الالتواء السالب، تسحب القيم الصغرى المتطرفة في الذيل الأيسر الوسط الحسابي لأسفل.","يقاوم الوسيط التأثر بالقيم المتطرفة، بينما يبقى المنوال عند القمة المرتفعة على اليمين.","وبالتالي تكون العلاقة: $\\text{Mean} < \\text{Median} < \\text{Mode}$."],"whyWrong":"Mean > Median > Mode is positive skew (skewed right). In left skew, the Mean is the smallest.","whyWrongAr":"المتوسط > الوسيط هو الالتواء الموجب (يميناً)، بينما في الالتواء السالب يكون المتوسط هو الأصغر."}},{"id":14,"question":"In a positively skewed (skewed right) distribution:","questionAr":"في التوزيع الملتوي إلى اليمين أو التواء موجب (Positively skewed):","options":["A) Mean > Median > Mode","B) Mean < Median < Mode","C) Mode = Mean = Median","D) Mode > Median > Mean"],"optionsAr":["A) المتوسط > الوسيط > المنوال (Mean > Median > Mode)","B) المتوسط < الوسيط < المنوال","C) المنوال = المتوسط = الوسيط","D) المنوال > الوسيط > المتوسط"],"correct":"A","explanation":{"concept":"Right-Skewed (Positive Skew) Relationship","conceptAr":"علاقة المقاييس في التوزيع الملتوي موجباً (يميناً)","steps":["In a positively skewed distribution, large extreme values in the right tail pull the Mean to the right.","The Mode remains at the peak on the left.","Thus: $\\text{Mean} > \\text{Median} > \\text{Mode}$."],"stepsAr":["في الالتواء الموجب، تسحب القيم الكبيرة في الذيل الأيمن الطويل الوسط الحسابي نحو اليمين.","ويبقى المنوال عند القمة جهة اليسار.","وبالتالي: $\\text{Mean} > \\text{Median} > \\text{Mode}$."],"whyWrong":"Option B is negative skew. When the tail stretches to the right, the Mean exceeds the Median.","whyWrongAr":"الخيار B التواء سالب. عندما يمتد الذيل جهة اليمين يكون المتوسط أكبر من الوسيط."}},{"id":15,"question":"The range is defined as:","questionAr":"يُعرَّف المدى (Range) بأنه:","options":["A) The average squared deviation from the mean","B) The positive square root of the variance","C) The difference between the maximum and minimum values","D) The standard deviation as a percentage of the mean"],"optionsAr":["A) متوسط مربعات الانحرافات عن الوسط","B) الجذر التربيعي الموجب للتباين","C) الفرق بين أكبر قيمة وأصغر قيمة (Difference between max and min)","D) الانحراف المعياري كنسبة مئوية من الوسط"],"correct":"C","explanation":{"concept":"Definition of Range","conceptAr":"تعريف المدى الإحصائي","steps":["The range is the simplest measure of dispersion: $\\text{Range} = \\text{Max} - \\text{Min}$.","It only considers the two extreme values and ignores the distribution of data between them."],"stepsAr":["المدى هو أبسط مقاييس التشتت: $\\text{Range} = \\text{Max} - \\text{Min}$.","يعتمد فقط على القيمتين الطرفيتين ويتجاهل توزيع القيم في الداخل."],"whyWrong":"A is variance, B is standard deviation, and D is coefficient of variation (CV).","whyWrongAr":"A هو التباين، و B هو الانحراف المعياري، و D هو معامل الاختلاف."}},{"id":16,"question":"The sample variance $s^2$ for raw data uses which denominator?","questionAr":"تباين العينة $s^2$ للبيانات الخام يستخدم في مقامه:","options":["A) $n$","B) $n - 1$","C) $n + 1$","D) $N$"],"optionsAr":["A) $n$","B) $n - 1$ (درجات الحرية)","C) $n + 1$","D) $N$"],"correct":"B","explanation":{"concept":"Sample Variance Degrees of Freedom (Bessel's Correction)","conceptAr":"درجات حرية تباين العينة وتصحيح بيسل","steps":["To make $s^2$ an unbiased estimator of population variance $\\sigma^2$, we divide by degrees of freedom $n - 1$ instead of $n$:","$s^2 = \\frac{\\sum (X - \\bar{X})^2}{n - 1}$","One degree of freedom is lost because the sample mean $\\bar{X}$ is used to estimate $\\mu$."],"stepsAr":["لجعل تباين العينة مقدراً غير متحيز لتباين المجتمع $\\sigma^2$، نقسم على درجات الحرية $n - 1$ بدلاً من $n$:","$s^2 = \\frac{\\sum (X - \\bar{X})^2}{n - 1}$","نفقد درجة حرية واحدة بسبب استخدام $\\bar{X}$ بدلاً من $\\mu$."],"whyWrong":"Dividing by $n$ underestimates $\\sigma^2$ (it is a biased estimator). Dividing by $n-1$ corrects this bias.","whyWrongAr":"القسمة على $n$ تعطي تقديراً متحيزاً وأقل من الحقيقة، والتصحيح يكون بالقسمة على $n-1$."}},{"id":17,"question":"The standard deviation is defined as:","questionAr":"يُعرَّف الانحراف المعياري (Standard Deviation) بأنه:","options":["A) The square of the variance","B) The positive square root of the variance","C) The difference between max and min","D) The average of all deviations"],"optionsAr":["A) مربع التباين","B) الجذر التربيعي الموجب للتباين (Positive square root of variance)","C) الفرق بين القيمة العظمى والدنيا","D) متوسط جميع الانحرافات"],"correct":"B","explanation":{"concept":"Standard Deviation Definition","conceptAr":"تعريف الانحراف المعياري","steps":["Variance is in squared units ($X^2$).","Taking the positive square root restores the original units of measurement: $s = \\sqrt{s^2}$."],"stepsAr":["التباين يُقاس بالوحدات المربعة ($X^2$).","بأخذ الجذر التربيعي الموجب، يعود المقياس لنفس وحدات قياس البيانات الأصلية: $s = \\sqrt{s^2}$."],"whyWrong":"The square of variance is $s^4$. The standard deviation is the square root of variance.","whyWrongAr":"مربع التباين هو $s^4$، بينما الانحراف المعياري هو الجذر التربيعي الموجب للتباين."}},{"id":18,"question":"The coefficient of variation (CV) is calculated as:","questionAr":"يُحسب معامل الاختلاف (CV) بالقانون:","options":["A) $s \\times \\bar{X} \\times 100\\%$","B) $\\frac{\\bar{X}}{s} \\times 100\\%$","C) $\\frac{s}{\\bar{X}} \\times 100\\%$","D) $\\frac{s^2}{\\bar{X}} \\times 100\\%$"],"optionsAr":["A) $s \\times \\bar{X} \\times 100\\%$","B) $\\frac{\\bar{X}}{s} \\times 100\\%$","C) $\\frac{s}{\\bar{X}} \\times 100\\%$ (معامل الاختلاف النسبي)","D) $\\frac{s^2}{\\bar{X}} \\times 100\\%$"],"correct":"C","explanation":{"concept":"Coefficient of Variation (CV)","conceptAr":"معامل الاختلاف (Coefficient of Variation)","steps":["CV expresses the standard deviation relative to the mean as a percentage:","$\\text{CV} = \\frac{s}{\\bar{x}} \\times 100\\%$","It is a unitless measure used to compare the relative dispersion of datasets with different units or disparate means."],"stepsAr":["يقيس معامل الاختلاف التشتت النسبي للانحراف المعياري مقارنة بالوسط كنسبة مئوية:","$\\text{CV} = \\frac{s}{\\bar{x}} \\times 100\\%$","وهو مقياس عديم الوحدات لمقارنة تشتت مجموعات بيانات ذات وحدات أو متوسطات متباينة."],"whyWrong":"The ratio is always standard deviation divided by the mean, not inverse or squared.","whyWrongAr":"النسبة دائماً هي الانحراف المعياري مقسوماً على الوسط الحسابي، وليست العكس."}},{"id":19,"question":"For grouped data, the mean is calculated using:","questionAr":"للبيانات المبوبة (Grouped data)، يُحسب الوسط الحسابي باستخدام الصيغة:","options":["A) $\\frac{\\sum x_i}{n}$","B) $\\frac{\\sum x_i f_i}{\\sum f_i}$","C) $\\frac{\\sum f_i}{\\sum x_i}$","D) $\\frac{\\sum (x_i - \\bar{X})^2}{N}$"],"optionsAr":["A) $\\frac{\\sum x_i}{n}$","B) $\\frac{\\sum x_i f_i}{\\sum f_i}$ (حيث $x_i$ هو مركز الفئة)","C) $\\frac{\\sum f_i}{\\sum x_i}$","D) $\\frac{\\sum (x_i - \\bar{X})^2}{N}$"],"correct":"B","explanation":{"concept":"Grouped Data Mean Formula","conceptAr":"قانون الوسط الحسابي للبيانات المبوبة","steps":["In grouped frequency tables, individual raw data points are lost, so each class is represented by its class mark (midpoint) $x_i = \\frac{\\text{Lower} + \\text{Upper}}{2}$.","The grouped mean is: $\\bar{X} = \\frac{\\sum f_i x_i}{\\sum f_i}$."],"stepsAr":["في البيانات المبوبة نستخدم مركز الفئة (Class mark) $x_i = \\frac{\\text{الحد الأدنى} + \\text{الحد الأعلى}}{2}$ كممثل لكل فئة.","الوسط الحسابي المبوب: $\\bar{X} = \\frac{\\sum f_i x_i}{\\sum f_i}$."],"whyWrong":"Option A is for ungrouped raw data. Option B properly weights each class midpoint by its frequency $f_i$.","whyWrongAr":"الخيار A للبيانات المفردة، بينما البيانات المبوبة تتطلب ضرب مركز الفئة بتكرارها."}},{"id":20,"question":"In the grouped data example (classes 0–8, 8–16, …, 40–48 with frequencies 8, 10, 16, 24, 15, 7; $N = 80$), the mean is:","questionAr":"في مثال البيانات المبوبة (الفئات 0–8، 8–16، ...، 40–48 بالتكرارات 8، 10، 16، 24، 15، 7؛ حيث $N = 80$)، يكون الوسط الحسابي:","formula":"\\bar{X} = \\frac{\\sum f_i x_i}{N}","tableData":{"headers":["Class Interval","Class Mark (x)","Frequency (f)","f · x"],"headersAr":["فئة الدرجات","مركز الفئة (x)","التكرار (f)","حاصل الضرب f · x"],"rows":[["0 - 8",4,8,32],["8 - 16",12,10,120],["16 - 24",20,16,320],["24 - 32",28,24,672],["32 - 40",36,15,540],["40 - 48",44,7,308],["Total","-",80,1992]],"caption":"Grouped frequency distribution and weighted products"},"options":["A) 22.5","B) 24.9","C) 26.0","D) 27.8"],"optionsAr":["A) 22.5","B) 24.9","C) 26.0","D) 27.8"],"correct":"B","explanation":{"concept":"Calculation of Grouped Mean","conceptAr":"حساب متوسط جدول التوزيع التكراري","steps":["Calculate midpoints $x_i$: 4, 12, 20, 28, 36, 44.","Compute $f_i \\cdot x_i$: $8(4)=32$, $10(12)=120$, $16(20)=320$, $24(28)=672$, $15(36)=540$, $7(44)=308$.","Sum of products: $\\sum f x = 32 + 120 + 320 + 672 + 540 + 308 = 1992$.","$\\bar{X} = \\frac{1992}{80} = 24.9$."],"stepsAr":["مراكز الفئات $x_i$: 4، 12، 20، 28، 36، 44.","حواصل الضرب $f \\cdot x$: 32 + 120 + 320 + 672 + 540 + 308 = 1992.","الوسط الحسابي: $\\bar{X} = \\frac{1992}{80} = 24.9$."],"whyWrong":"Dividing the total weighted sum 1992 by the total frequency 80 gives 24.9 exactly.","whyWrongAr":"قسمة المجموع المرجح 1992 على 80 ينتج 24.9 بالضبط."}}]},{"id":"lecture-3-probability-distributions","quizNumber":3,"lectureNumber":3,"title":"Lecture 3: Probability Distributions","titleAr":"المحاضرة 3: التوزيعات الاحتمالية","subtitle":"Binomial, Poisson, Normal, Z-score transformations, probabilities, and the Central Limit Theorem","subtitleAr":"توزيع ذي الحدين، بواسون، التوزيع الطبيعي، تحويلات Z، حساب الاحتمالات، ونظرية النهاية المركزية","difficulty":"Hard","questionCount":20,"questions":[{"id":1,"question":"According to the probability distributions tree, which of the following is a discrete distribution?","questionAr":"وفقاً لشجرة تصنيف التوزيعات الاحتمالية، أي من التوزيعات التالية يُعد توزيعاً احتمالياً منفصلاً؟","options":["A) Normal","B) Student's t","C) Poisson","D) Chi-Square"],"optionsAr":["A) التوزيع الطبيعي (Normal)","B) توزيع تي ستيودنت (Student's t)","C) توزيع بواسون (Poisson)","D) توزيع كاي تربيع (Chi-Square)"],"correct":"C","explanation":{"concept":"Discrete vs. Continuous Distributions","conceptAr":"التوزيعات المنفصلة مقابل المتصلة","steps":["Discrete distributions model random variables that take distinct, countable integer values: $X \\in \\{0, 1, 2, \\dots\\}$. Key discrete distributions include Binomial and Poisson.","Normal, Student's t, and Chi-Square are all continuous distributions defined over intervals of real numbers."],"stepsAr":["التوزيعات المنفصلة تصوغ متغيرات تأخذ قيماً صحيحة قابلة للعد ($0, 1, 2, \\dots$)، مثل توزيع ذي الحدين وتوزيع بواسون.","بينما التوزيع الطبيعي وتي وكاي تربيع هي توزيعات متصلة (Continuous)."],"whyWrong":"Normal, Student's t, and Chi-square are continuous. Poisson counts occurrences ($k = 0, 1, 2, \\dots$), so it is discrete.","whyWrongAr":"التوزيعات A و B و D هي توزيعات احتمالية متصلة، بينما بواسون منفصل بالعد."}},{"id":2,"question":"The Binomial distribution models the number of successes in:","questionAr":"يُمثِّل توزيع ذي الحدين (Binomial Distribution) عدد مرات النجاح في:","options":["A) An infinite number of trials","B) A fixed number of independent Bernoulli trials","C) A Poisson process","D) A continuous interval"],"optionsAr":["A) عدد لانهائي من المحاولات","B) عدد محدد وثابت من محاولات برنولي المستقلة (Fixed independent Bernoulli trials)","C) عملية بواسون","D) فترة متصلة"],"correct":"B","explanation":{"concept":"Conditions for a Binomial Experiment","conceptAr":"شروط تجربة ذي الحدين","steps":["1. The experiment consists of a fixed number of trials, $n$.","2. Each trial has only two mutually exclusive outcomes: Success or Failure.","3. The probability of success $p$ is constant from trial to trial.","4. The trials are independent Bernoulli trials."],"stepsAr":["1. عدد المحاولات $n$ ثابت ومحدد مسبقاً.","2. كل محاولة لها ناتجان فقط: نجاح أو فشل.","3. احتمال النجاح $p$ ثابت في كل محاولة.","4. المحاولات مستقلة عن بعضها تماماً."],"whyWrong":"Trials must be finite ($n$), binary (Bernoulli), and independent with constant probability $p$.","whyWrongAr":"المحاولات يجب أن تكون محددة العدد وثنائية ومستقلة، وليست لانهائية."}},{"id":3,"question":"For a binomial random variable with parameters $n$ and $p$, the mean $E[X]$ is:","questionAr":"لمتغير عشوائي ذي الحدين بالمعلمتين $n$ و $p$، فإن المتوسط الحسابي (القيمة المتوقعة $E[X]$) يُعطى بـ:","options":["A) $np(1-p)$","B) $np$","C) $p/n$","D) $n/p$"],"optionsAr":["A) $np(1-p)$","B) $np$","C) $p/n$","D) $n/p$"],"correct":"B","explanation":{"concept":"Mean (Expected Value) of Binomial Distribution","conceptAr":"متوسط (القيمة المتوقعة) لتوزيع ذي الحدين","steps":["For $n$ independent trials each with success probability $p$, the expected number of successes is:","$\\mu = E[X] = \\sum_{i=1}^{n} E[X_i] = n \\cdot p = np$."],"stepsAr":["لمتغير ثنائي الحدين، القيمة المتوقعة لمجموع $n$ من محاولات برنولي هي:","$\\mu = E[X] = np$."],"whyWrong":"np(1-p) is the variance $\\sigma^2$, not the mean. The mean is simply $np$.","whyWrongAr":"$np(1-p)$ هو التباين $\\sigma^2$، بينما المتوسط هو $np$."}},{"id":4,"question":"For a binomial random variable, the variance $\\text{Var}(X)$ is:","questionAr":"لمتغير عشوائي يتبع توزيع ذي الحدين، فإن التباين $\\text{Var}(X)$ يُعطى بـ:","options":["A) $np$","B) $np(1-p)$","C) $n(1-p)$","D) $p(1-p)$"],"optionsAr":["A) $np$","B) $np(1-p)$","C) $n(1-p)$","D) $p(1-p)$"],"correct":"B","explanation":{"concept":"Variance of Binomial Distribution","conceptAr":"تباين توزيع ذي الحدين","steps":["Variance formula: $\\sigma^2 = \\text{Var}(X) = np(1-p) = npq$, where $q = 1-p$ is the probability of failure.","Standard deviation is $\\sigma = \\sqrt{np(1-p)}$."],"stepsAr":["صيغة التباين: $\\sigma^2 = \\text{Var}(X) = np(1-p) = npq$، حيث $q = 1-p$ احتمال الفشل.","والانحراف المعياري هو $\\sigma = \\sqrt{np(1-p)}$."],"whyWrong":"$np$ is the mean. The variance incorporates the probability of failure: $np(1-p)$.","whyWrongAr":"$np$ هو المتوسط، أما التباين فيشمل احتمال الفشل أيضاً $np(1-p)$."}},{"id":5,"question":"The binomial probability mass function (PMF) $P(X = x)$ is given by:","questionAr":"دالة الكتلة الاحتمالية (PMF) لتوزيع ذي الحدين $P(X = x)$ تُعطى بالصيغة:","options":["A) $\\frac{\\lambda^x e^{-\\lambda}}{x!}$","B) $\\binom{n}{x} p^x (1-p)^{n-x}$","C) $\\frac{1}{\\sigma\\sqrt{2\\pi}} e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$","D) $p^x (1-p)^x$"],"optionsAr":["A) $\\frac{\\lambda^x e^{-\\lambda}}{x!}$","B) $\\binom{n}{x} p^x (1-p)^{n-x}$","C) $\\frac{1}{\\sigma\\sqrt{2\\pi}} e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$","D) $p^x (1-p)^x$"],"correct":"B","explanation":{"concept":"Binomial Probability Mass Function (PMF)","conceptAr":"دالة الكتلة الاحتمالية لذي الحدين","steps":["Formula: $P(X = x) = \\binom{n}{x} p^x (1-p)^{n-x}$ for $x = 0, 1, 2, \\dots, n$.","$\\binom{n}{x} = \\frac{n!}{x!(n-x)!}$ counts the number of arrangements of $x$ successes in $n$ trials.","$p^x (1-p)^{n-x}$ is the probability of any one specific arrangement."],"stepsAr":["الصيغة: $P(X = x) = \\binom{n}{x} p^x (1-p)^{n-x}$ للقيم $x = 0, 1, \\dots, n$.","التوافيق $\\binom{n}{x} = \\frac{n!}{x!(n-x)!}$ تحسب عدد التباديل الممكنة لـ $x$ نجاح من بين $n$ محاولة.","$p^x (1-p)^{n-x}$ هو احتمال حدوث الترتيب الفردي الواحد."],"whyWrong":"A is Poisson PMF, and C is the Normal density function (PDF). B is the Binomial PMF.","whyWrongAr":"A دالة بواسون، و C دالة كثافة التوزيع الطبيعي المتصل، و B هي دالة ذي الحدين الصحيحة."}},{"id":6,"question":"The Poisson distribution expresses the probability of a given number of events occurring within:","questionAr":"يُعبِّر توزيع بواسون عن احتمال وقوع عدد محدد من الأحداث المستقلة خلال:","options":["A) A fixed number of trials","B) A fixed interval of time or space","C) A continuous range","D) A standard normal curve"],"optionsAr":["A) عدد محدد من المحاولات","B) فترة أو وحدة محددة من الزمن أو المكان (Fixed interval of time or space)","C) مدى متصل","D) منحنى طبيعي معياري"],"correct":"B","explanation":{"concept":"Poisson Process Domain","conceptAr":"مجال وتطبيق عملية بواسون","steps":["The Poisson distribution models count data: the number of rare events occurring in a fixed interval of time, distance, area, or volume.","Examples: phone calls per minute, defects per square meter of cloth, potholes per mile."],"stepsAr":["يصوغ توزيع بواسون عدد مرات وقوع حدث نادر ومستقل خلال فترة زمنية أو حيز مكاني محدد.","أمثلة: عدد المكالمات في الدقيقة، عدد العيوب في المتر المربع، عدد حوادث السير أسبوعياً."],"whyWrong":"Binomial is based on a fixed number of trials ($n$). Poisson is defined over continuous units of time or space with average rate $\\lambda$.","whyWrongAr":"توزيع ذي الحدين يعتمد على عدد محاولات ثابت $n$، بينما بواسون يعتمد على فترة زمنية أو مساحة بمعدل $\\lambda$."}},{"id":7,"question":"A unique property of the Poisson distribution with parameter $\\lambda$ is that:","questionAr":"الخاصية الفريدة التي تميز توزيع بواسون ذي المعلمة $\\lambda$ هي أن:","options":["A) Mean > Variance","B) Mean < Variance","C) Mean = Variance = \\lambda","D) Mean and variance are unrelated"],"optionsAr":["A) المتوسط > التباين","B) المتوسط < التباين","C) المتوسط = التباين = \\lambda (Mean = Variance = \\lambda)","D) المتوسط والتباين غير مترابطين"],"correct":"C","explanation":{"concept":"Equidispersion Property of Poisson","conceptAr":"خاصية تساوي المتوسط والتباين في بواسون (Equidispersion)","steps":["In a Poisson distribution with parameter $\\lambda$:","Expected Value: $\\mu = E[X] = \\lambda$","Variance: $\\sigma^2 = \\text{Var}(X) = \\lambda$","Standard deviation: $\\sigma = \\sqrt{\\lambda}$."],"stepsAr":["في توزيع بواسون ذي المعلمة $\\lambda$:","المتوسط: $\\mu = E[X] = \\lambda$","التباين: $\\sigma^2 = \\text{Var}(X) = \\lambda$","الانحراف المعياري: $\\sigma = \\sqrt{\\lambda}$."],"whyWrong":"The defining characteristic of Poisson is that mean and variance are identical and equal to $\\lambda$.","whyWrongAr":"السمة الأساسية لبواسون هي التساوي الحتمي بين المتوسط والتباين وتساويهما مع $\\lambda$."}},{"id":8,"question":"The Poisson PMF is:","questionAr":"دالة الكتلة الاحتمالية (PMF) لتوزيع بواسون هي:","options":["A) $\\binom{n}{x} p^x (1-p)^{n-x}$","B) $\\frac{\\lambda^x e^{-\\lambda}}{x!}$","C) $\\frac{1}{\\sqrt{2\\pi}} e^{-\\frac{z^2}{2}}$","D) $np(1-p)$"],"optionsAr":["A) $\\binom{n}{x} p^x (1-p)^{n-x}$","B) $\\frac{\\lambda^x e^{-\\lambda}}{x!}$","C) $\\frac{1}{\\sqrt{2\\pi}} e^{-\\frac{z^2}{2}}$","D) $np(1-p)$"],"correct":"B","explanation":{"concept":"Poisson PMF Formula","conceptAr":"صيغة دالة بواسون الاحتمالية","steps":["Formula: $P(X = x) = \\frac{\\lambda^x e^{-\\lambda}}{x!}$ for $x = 0, 1, 2, \\dots$","Where $\\lambda > 0$ is the average arrival rate, and $e \\approx 2.71828$."],"stepsAr":["الصيغة: $P(X = x) = \\frac{\\lambda^x e^{-\\lambda}}{x!}$ للأعداد $x = 0, 1, 2, \\dots$","حيث $\\lambda$ هو متوسط معدل الحدوث، و $e \\approx 2.71828$."],"whyWrong":"A is Binomial PMF, C is the standard normal density, and D is binomial variance. B is Poisson.","whyWrongAr":"A لذي الحدين، و C للتوزيع الطبيعي المعياري، و B هي صيغة بواسون الصحيحة."}},{"id":9,"question":"Which of the following is a continuous distribution?","questionAr":"أي من التوزيعات التالية يُعتبر توزيعاً احتمالياً متصلاً؟","options":["A) Binomial","B) Poisson","C) Normal","D) None of the above"],"optionsAr":["A) ذو الحدين (Binomial)","B) بواسون (Poisson)","C) التوزيع الطبيعي (Normal)","D) لا شيء مما سبق"],"correct":"C","explanation":{"concept":"Continuous Probability Distribution","conceptAr":"التوزيع الاحتمالي المتصل","steps":["The Normal (Gaussian) distribution is a continuous distribution defined on $(-\\infty, \\infty)$.","Probabilities for continuous distributions are calculated as areas under the curve using integration: $P(a \\le X \\le b) = \\int_{a}^{b} f(x) dx$."],"stepsAr":["التوزيع الطبيعي (Normal/Gaussian) هو توزيع احتمالي متصل معرف على خط الأعداد الحقيقية بالكامل $(-\\infty, \\infty)$.","الاحتمالات في التوزيعات المتصلة تقاس بالمساحات تحت المنحنى عبر التكامل."],"whyWrong":"Binomial and Poisson are discrete distributions based on counting discrete outcomes.","whyWrongAr":"توزيع ذي الحدين وبواسون منفصلان بالعد، بينما التوزيع الطبيعي متصل."}},{"id":10,"question":"The normal density function $f(x)$ involves the parameters:","questionAr":"تعتمد دالة كثافة التوزيع الطبيعي $f(x)$ على المعلمتين:","options":["A) n and p","B) \\lambda","C) \\mu and \\sigma","D) k and N"],"optionsAr":["A) n و p","B) \\lambda","C) \\mu و \\sigma (المتوسط والانحراف المعياري)","D) k و N"],"correct":"C","explanation":{"concept":"Normal Distribution Parameters","conceptAr":"معلمات التوزيع الطبيعي","steps":["The normal distribution $N(\\mu, \\sigma^2)$ is fully characterized by two parameters:","$\\mu$: the mean, determining the center of the bell curve.","$\\sigma$: the standard deviation, determining the dispersion/spread of the bell curve."],"stepsAr":["يتحدد التوزيع الطبيعي $N(\\mu, \\sigma^2)$ كلياً بمعلمتين اثنتين:","$\\mu$: الوسط الحسابي (موقع المركز).","$\\sigma$: الانحراف المعياري (مقدار الانتشار والاتساع)."],"whyWrong":"$n$ and $p$ are for Binomial; $\\lambda$ is for Poisson. Normal requires $\\mu$ and $\\sigma$.","whyWrongAr":"$n, p$ لذي الحدين، و $\\lambda$ لبواسون، أما التوزيع الطبيعي فيحدده $\\mu$ و $\\sigma$."}},{"id":11,"question":"The standard normal distribution $Z$ has:","questionAr":"يتميز التوزيع الطبيعي المعياري $Z$ بأن له:","options":["A) Mean = 1, SD = 0","B) Mean = 0, SD = 1","C) Mean = 0, SD = 0","D) Mean = 1, SD = 1"],"optionsAr":["A) متوسط = 1، انحراف = 0","B) متوسط = 0، انحراف = 1 (Mean = 0, SD = 1)","C) متوسط = 0، انحراف = 0","D) متوسط = 1، انحراف = 1"],"correct":"B","explanation":{"concept":"Standard Normal Distribution (Z)","conceptAr":"خصائص التوزيع الطبيعي المعياري Z","steps":["The standard normal distribution is symbolized by $Z$.","Its parameters are fixed at: Mean $\\mu = 0$ and Standard Deviation $\\sigma = 1$ (variance $\\sigma^2 = 1$)."],"stepsAr":["يُرمز للتوزيع الطبيعي المعياري بالرمز $Z$.","معلماته ثابتة دائماً: المتوسط $\\mu = 0$ والانحراف المعياري $\\sigma = 1$."],"whyWrong":"A standard deviation cannot be 0 (no spread). The standard normal has $\\mu = 0$ and $\\sigma = 1$.","whyWrongAr":"لا يمكن للانحراف المعياري أن يكون صفراً، فالتوزيع الطبيعي المعياري مركزه 0 وانحرافه 1."}},{"id":12,"question":"The z-score transformation is given by:","questionAr":"تحويل القيمة الخام إلى الدرجة المعيارية z يُعطى بالصيغة:","options":["A) $Z = \\frac{Y - \\mu}{\\sigma}$","B) $Z = \\frac{\\mu - Y}{\\sigma}$","C) $Z = \\frac{\\sigma}{Y - \\mu}$","D) $Z = \\frac{Y}{\\sigma}$"],"optionsAr":["A) $Z = \\frac{Y - \\mu}{\\sigma}$","B) $Z = \\frac{\\mu - Y}{\\sigma}$","C) $Z = \\frac{\\sigma}{Y - \\mu}$","D) $Z = \\frac{Y}{\\sigma}$"],"correct":"A","explanation":{"concept":"Standardization (Z-Score)","conceptAr":"التحويل المعياري (الدرجة المعيارية Z)","steps":["The z-score measures how many standard deviations an observation $Y$ lies above or below the population mean $\\mu$:","$Z = \\frac{Y - \\mu}{\\sigma}$"],"stepsAr":["تقيس الدرجة المعيارية $Z$ بعد القيمة $Y$ عن الوسط الحسابي $\\mu$ بوحدات الانحراف المعياري $\\sigma$:","$Z = \\frac{Y - \\mu}{\\sigma}$"],"whyWrong":"Subtracting $Y$ from $\\mu$ reverses the sign. Dividing $\\sigma$ by the deviation is the inverse.","whyWrongAr":"طرح $Y$ من $\\mu$ يعكس الإشارة، والقانون الصحيح هو القيمة ناقص المتوسط مقسوماً على الانحراف."}},{"id":13,"question":"For a normal distribution with $\\mu = 125$ and $\\sigma = 13.7$, the z-score for $X = 110$ is approximately:","questionAr":"لتوزيع طبيعي بمتوسط $\\mu = 125$ وانحراف معياري $\\sigma = 13.7$، فإن الدرجة المعيارية للقيمة $X = 110$ تساوي تقريباً:","formula":"Z = \\frac{X - \\mu}{\\sigma}","options":["A) 1.09","B) −1.09","C) 5.29","D) −5.29"],"optionsAr":["A) 1.09","B) −1.09","C) 5.29","D) −5.29"],"correct":"B","explanation":{"concept":"Z-Score Computation","conceptAr":"حساب الدرجة المعيارية","steps":["Given $X = 110, \\mu = 125, \\sigma = 13.7$:","$Z = \\frac{110 - 125}{13.7} = \\frac{-15}{13.7} \\approx -1.0949 \\approx -1.09$","Since $110 < 125$, the $Z$ score must be negative."],"stepsAr":["المعطيات: $X = 110, \\mu = 125, \\sigma = 13.7$:","$Z = \\frac{110 - 125}{13.7} = \\frac{-15}{13.7} \\approx -1.09$","بما أن القيمة 110 أصغر من المتوسط 125، فإن إشارة $Z$ سالبة حتماً."],"whyWrong":"+1.09 has the wrong sign. The value 110 is below the mean, so Z is negative.","whyWrongAr":"+1.09 خاطئ في الإشارة، فالقيمة تقع يسار المتوسط وبالتالي سالبة."}},{"id":14,"question":"For the blood pressure example ($\\mu = 125, \\sigma = 13.7$), $P(X > 197.5)$ is approximately:","questionAr":"لمثال ضغط الدم ($\\mu = 125, \\sigma = 13.7$)، الاحتمال $P(X > 197.5)$ يساوي تقريباً:","formula":"Z = \\frac{X - \\mu}{\\sigma}","options":["A) 0.1379","B) 0.7242","C) 0.0062","D) 0.0000 (beyond table range, z ≈ 5.29)"],"optionsAr":["A) 0.1379","B) 0.7242","C) 0.0062","D) 0.0000 (خارج نطاق الجدول، z ≈ 5.29)"],"correct":"D","explanation":{"concept":"Extreme Tail Normal Probability","conceptAr":"احتمال الذيل المتطرف في التوزيع الطبيعي","steps":["Step 1: Convert $X = 197.5$ to $Z$ score:","$Z = \\frac{197.5 - 125}{13.7} = \\frac{72.5}{13.7} \\approx +5.29$","Step 2: A z-score of $+5.29$ lies more than 5 standard deviations above the mean.","Standard normal tables only go up to $Z = 3.49$ (where area is $0.9998$). Beyond $Z = 5$, the right tail probability is effectively $0.0000$."],"stepsAr":["الخطوة 1: تحويل $X = 197.5$ إلى درجة معيارية:","$Z = \\frac{197.5 - 125}{13.7} = \\frac{72.5}{13.7} \\approx +5.29$","الخطوة 2: الدرجة المعيارية $+5.29$ تقع على بعد أكثر من 5 انحرافات معيارية فوق الوسط، مما يجعل المساحة في أقصى اليمين تقترب عملياً من الصفر $0.0000$."],"whyWrong":"Standard normal tables max out at ~3.5. At Z = 5.29, the tail probability rounds to 0.0000.","whyWrongAr":"عند Z = 5.29 نكون في ذيل شديد التطرف خارج مدى الجداول وتؤول المساحة إلى الصفر."}},{"id":15,"question":"For the blood pressure example, $P(X < 110) = P(Z < -1.09)$ equals:","questionAr":"لمثال ضغط الدم، الاحتمال $P(X < 110) = P(Z < -1.09)$ يساوي:","options":["A) 0.1379","B) 0.8621","C) 0.7242","D) 0.0062"],"optionsAr":["A) 0.1379 (بالتماثل، P(Z > 1.09))","B) 0.8621","C) 0.7242","D) 0.0062"],"correct":"A","explanation":{"concept":"Left-Tail Probability from Standard Normal Table","conceptAr":"حساب احتمال الذيل الأيسر من جدول Z","steps":["From standard normal distribution tables, the cumulative area up to $Z = 1.09$ is $\\Phi(1.09) = 0.8621$.","By the bell curve symmetry:","$P(Z < -1.09) = P(Z > 1.09) = 1 - \\Phi(1.09) = 1 - 0.8621 = 0.1379$."],"stepsAr":["من جدول التوزيع الطبيعي المعياري، المساحة التراكمية حتى $Z = 1.09$ هي $0.8621$.","بتماثل المنحنى الطبيعي:","$P(Z < -1.09) = 1 - 0.8621 = 0.1379$."],"whyWrong":"0.8621 is the cumulative probability $P(Z < 1.09)$. For the lower tail $Z < -1.09$, it is $1 - 0.8621 = 0.1379$.","whyWrongAr":"0.8621 هو احتمال المساحة إلى يسار +1.09، أما يسار -1.09 فيساوي المتممة 0.1379."}},{"id":16,"question":"For the blood pressure example, $P(110 < X < 140) = P(-1.09 < Z < 1.09)$ equals:","questionAr":"لمثال ضغط الدم، الاحتمال $P(110 < X < 140) = P(-1.09 < Z < 1.09)$ يساوي:","options":["A) 0.1379","B) 0.7242","C) 0.8621","D) 0.0062"],"optionsAr":["A) 0.1379","B) 0.7242","C) 0.8621","D) 0.0062"],"correct":"B","explanation":{"concept":"Symmetric Interval Probability in Normal Distribution","conceptAr":"احتمال فترة متماثلة حول المتوسط في التوزيع الطبيعي","steps":["$Z_1 = \\frac{110 - 125}{13.7} = -1.09$","$Z_2 = \\frac{140 - 125}{13.7} = +1.09$","$P(-1.09 < Z < 1.09) = \\Phi(1.09) - \\Phi(-1.09)$","$\\Phi(1.09) = 0.8621$ and $\\Phi(-1.09) = 0.1379$","Probability $= 0.8621 - 0.1379 = 0.7242$."],"stepsAr":["$Z_1 = \\frac{110 - 125}{13.7} = -1.09$","$Z_2 = \\frac{140 - 125}{13.7} = +1.09$","$P(-1.09 < Z < 1.09) = 0.8621 - 0.1379 = 0.7242$."],"whyWrong":"Subtracting the lower tail (0.1379) from the upper cumulative area (0.8621) gives 0.7242.","whyWrongAr":"طرح مساحة الذيل الأيسر (0.1379) من المساحة التراكمية
